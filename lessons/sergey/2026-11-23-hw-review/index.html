## 2. Fix it: your answer about Henk
TYPE: fix
TEXT: These sentences come from your answer. Each has **one** problem. Correct it right in the sentence.
1. I'm not sure if I will take the risk of publishing Tetris alone. = I'm not sure if I would take the risk of publishing Tetris alone. ; I'm not sure I would take the risk of publishing Tetris alone. ; I'm not sure whether I would take the risk of publishing Tetris alone. ; I'm not sure if I'd take the risk of publishing Tetris alone. | hint: You imagine yourself in 1988: it's hypothetical, not real future.
2. For those years, it required a lot of money. = In those years, it required a lot of money. ; At that time, it required a lot of money. ; Back then, it required a lot of money. | hint: The preposition for a period in the past is not “for”.
3. And a lot people saw this potential too. = And a lot of people saw this potential too. ; And lots of people saw this potential too. | hint: a lot … people
4. Maybe I wouldn't risk like Henk did. = Maybe I wouldn't take a risk like Henk did. ; Maybe I wouldn't take the risk Henk did. ; Maybe I wouldn't take risks like Henk did. | hint: The verb “risk” needs an object (risk your money); here a set phrase is better: take a …
5. It could be advertised as the first Soviet game in west. = It could be advertised as the first Soviet game in the West. | hint: the political West, like the East, takes an article and a capital letter.
6. I'd try to sell the game for price as high as possible. = I'd try to sell the game for as high a price as possible. ; I'd try to sell the game at as high a price as possible. ; I'd try to sell the game for the highest possible price. ; I'd try to sell the game at the highest possible price. | hint: as high a price as possible / the highest possible price

## 3. Would or will?
TYPE: choose
TEXT: Real future or an imagined situation? Choose the correct form.
1. If I were Henk, I ___ the money and run. = would take | options: will take ; would take ; take
2. I'm absolutely sure I ___ to sell it at the highest possible price. = would try | options: tried ; will try ; would try
3. If the patch comes out tomorrow, I ___ the game again. = will play | options: will play ; would play ; would have played
4. In 1988, I'm not sure a small company ___ the costs. = could recoup | options: could recoup ; can recoup ; will recoup
5. Without the deal, Tetris ___ the West so quickly. = wouldn't have reached | options: won't reach ; wouldn't have reached ; didn't reach

## 4. Say it like a publisher
TYPE: gap
TEXT: Phrases for talking about business risk. **One phrase is extra.**
BANK: a gamble; paid off; fail to recoup; market it as; as high a price as possible; take the plunge; break even
1. Publishing a game alone in 1988 was a real ___: it could make him rich or ruin him. = a gamble | hint: a risk that may bring a big win or a big loss
2. In the end, the risk ___: the game sold millions of copies. = paid off | hint: brought a good result (past)
3. A small studio can easily ___ the costs of a big launch. = fail to recoup | hint: not get back the money it spent
4. You could ___ “the first game from behind the Iron Curtain”. = market it as | hint: advertise and present it as
5. Before you sell the rights, ask for ___. = as high a price as possible | hint: the maximum money you can get
6. The studio needs to sell 50,000 copies just to ___. = break even | hint: earn exactly what it spent, no profit, no loss
