<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roadmap A2+ · Unit 2A · Vocabulary lesson</title><style>
:root{--ink:#26342f;--muted:#68766f;--bg:#f3f0ea;--card:#fffdf9;--sage:#789b89;--sage2:#e6f0ea;--peach:#f5dfd2;--yellow:#fff4cf;--line:#e2ddd5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f5f1eb,#edf4f0);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 70px}header,.card{background:rgba(255,253,249,.97);border:1px solid #e3ded6;border-radius:24px;box-shadow:0 8px 28px #52675d12}header{padding:28px;margin-bottom:18px}.eyebrow,.label{color:#557769;font-weight:850;text-transform:uppercase;letter-spacing:.07em;font-size:12px}h1{font-size:clamp(30px,5vw,48px);line-height:1.05;margin:5px 0 10px}h2{font-size:26px;margin:3px 0 8px}h3{margin:7px 0}.card{padding:22px;margin:16px 0}.head{display:flex;gap:12px}.num{flex:0 0 40px;height:40px;background:var(--sage2);color:#486d5d;border-radius:14px;display:grid;place-items:center;font-weight:900}.bank,.answers{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.chip{border:1px solid #d9d5cd;background:#fff;border-radius:999px;padding:8px 12px;font-weight:750}.q{padding:14px 0;border-top:1px solid #eee9e2}.q:first-of-type{border-top:0}.qrow{display:grid;grid-template-columns:32px 1fr;gap:8px}.qn{font-weight:900;color:#668273}select,input,textarea{font:inherit;color:inherit;border:1.5px solid #cbd7d0;background:#fff;border-radius:13px;padding:10px 12px;min-height:45px}select,input{width:min(100%,550px)}textarea{width:100%;min-height:90px}button{font:inherit;font-weight:850;border:0;border-radius:13px;padding:10px 15px;background:var(--sage);color:#fff;cursor:pointer}button.secondary{background:#eee8df;color:#40534a}.hint,.example{display:none;margin-top:8px;padding:10px 12px;border-radius:13px;background:var(--yellow);color:#69583d}.feedback{font-weight:800;min-height:22px;margin-top:6px}.good{color:#3d7d5e}.bad{color:#b35f54}.speak{margin-top:16px;padding:16px;border-radius:18px;background:#f8ebe3}.speak .question{padding:12px 0;border-top:1px solid #ead7cc}.speak .question:first-of-type{border:0}.starter{color:#6d5a4e;font-weight:700}.choice{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.choice label{background:#fff;border:1px solid #ddd7cf;border-radius:12px;padding:8px 11px}.note{background:#edf4f0;border-left:5px solid var(--sage);padding:13px;border-radius:13px}.challenge{border:2px dashed #e1b673}.footer{color:var(--muted);text-align:center;margin-top:20px}@media(max-width:600px){header,.card{padding:18px;border-radius:19px}.qrow{grid-template-columns:26px 1fr}}
</style></head><body><div class="wrap"><header><div class="eyebrow">Roadmap A2+ · Unit 2A</div><h1>One of those days</h1><p><b>Lesson goal:</b> describe feelings and prepare to talk about a memorable day.</p><p class="note">Today: Vocabulary. Listening 2.1 is reserved for the next homework.</p></header><main id="app"></main></div><script>
const KEY='anastasia-lesson-2a-vocabulary-2026-08-18';let qn=0;
document.head.insertAdjacentHTML('beforeend',`<style>.chip{cursor:pointer;transition:.18s;color:var(--ink)}.chip.used{background:var(--sage);border-color:var(--sage);color:#fff;text-decoration:line-through}.brain{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.brain-card{background:#fff8ee;border:1px solid #ead9c4;border-radius:16px;padding:13px}.brain-card input{width:100%;margin-top:7px}@media(max-width:600px){.brain{grid-template-columns:1fr}}</style>`);
const main=['afraid','angry','bored','excited','happy','nervous','relaxed','stressed','surprised','worried'];
function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function chips(words){return words.map(x=>`<span class="chip" role="button" tabindex="0" data-word="${x}">${x}</span>`).join('')}
function openFeeling(text,i){return `<div class="q"><div class="qrow"><span class="qn">${i+1}</span><div><p>${text}</p><input class="feeling-input" placeholder="Write one or more feelings"></div></div></div>`}
function sel(text,opts,ans,hint){const id='q'+(++qn);return `<div class="q" data-id="${id}" data-answer="${ans}" data-hint="${e(hint)}"><div class="qrow"><span class="qn">${qn}</span><div>${text}<br><select><option value="">Choose…</option>${opts.map(x=>`<option>${x}</option>`).join('')}</select><br><button class="secondary" onclick="hint(this)">Hint</button> <button onclick="checkOne(this)">Check</button><div class="hint"></div><div class="feedback"></div></div></div></div>`}
function speak(title,qs){return `<div class="speak"><span class="label">Speaking · ${title}</span>${qs.map((q,i)=>`<div class="question"><h3>${q[0]}</h3><div class="starter">Start: ${q[1]}</div><button class="secondary" onclick="example(this)">Show an example</button><div class="example">${q[2]}</div></div>`).join('')}</div>`}
function card(n,title,body,cls=''){return `<section class="card ${cls}"><div class="head"><span class="num">${n}</span><div><span class="label">Unit 2A · Vocabulary</span><h2>${title}</h2></div></div>${body}</section>`}
let html='';
html+=card('W','Warm-up',`<p>Choose one answer for each prompt. Then explain why.</p>`+[
['You have a flight to Germany tomorrow. You want to be on time, but the flight information changes. How do you feel?',['relaxed','worried','bored'],'worried','The plan changed and you might be late.'],
['You cook a simple meal and it is different from your usual food. It tastes great. How do you feel?',['surprised','afraid','stressed'],'surprised','The good result was unexpected.'],
['You forget an important piece of advice. How do you feel?',['worried','excited','relaxed'],'worried','You may have a problem because you forgot it.']].map(x=>sel(x[0],x[1],x[2],x[3])).join('')+speak('Personal',[
['What helps you be on time when you have an important journey?','To be on time, I usually …','To be on time, I usually prepare everything in advance and check for delays.'],
['What kind of news can make you feel excited?','I feel excited when I hear that …','I feel excited when I hear that a journey is going ahead as planned.']]))
html+=card(2,'Feelings',`<p>Tap a word when you use it. Tap it again to return it.</p><div class="bank">${chips(main)}</div><p>Choose the adjective that fits each situation.</p>`+[
['Sadie has a big presentation for 600 people.',['angry','nervous'],'nervous','A big presentation can make you anxious.'],
['Hamza is calm about his interview. He isn’t nervous.',['relaxed','worried'],'relaxed','He feels calm.'],
['There is nothing to do except watch TV.',['bored','stressed'],'bored','Nothing is interesting.'],
['Pablo talks about his holiday all the time.',['surprised','excited'],'excited','He is looking forward to it.'],
['She is having a very difficult time at work.',['stressed','afraid'],'stressed','Too much pressure causes this feeling.'],
['Matteo has an exam tomorrow.',['nervous','afraid'],'nervous','An exam usually makes people anxious, not frightened.']].map(x=>sel(x[0],x[1],x[2],x[3])).join('')+speak('Experience',[
['When were you nervous but everything went well?','I was nervous when …, but …','I was nervous before a journey, but the flight was on time.'],
['When did a delay make you stressed?','I felt stressed when … was delayed because …','I felt stressed when my appointment was delayed because I had other plans.']]))
html+=card(3,'How would you feel?',`<p>Think of as many adjectives as possible for each situation. Type your own answers. Tap a word in the bank after you use it.</p><div class="bank">${chips(main)}</div>`+[
'You find out that someone is saying bad things about you to other people.',
'You’re lying on your sofa at the end of a long day, watching a film.',
'You have a job interview tomorrow morning.',
'You’re lost in a big city at night.',
'You’re graduating from university.',
'You’re having a fun day with your friends.',
'You receive a present in the post from someone you don’t know.',
'You have to pay a bill, but you don’t have any money.'
].map(openFeeling).join('')+speak('Hypothetical',[
['Imagine you spend money on something and then discover it was a bad choice. How do you feel?','I would feel … because …','I would feel annoyed because I spent money on something useless.'],
['Imagine you are good at a difficult game, but another player is cunning. What do you do?','First, I feel … . Then I …','First, I feel annoyed. Then I stay calm and change my plan.']]))
html+=card(4,'Guess the feeling',`<p>Write one situation for each feeling. Do not use the feeling word. Read it aloud and let your teacher guess.</p>`+['nervous','relaxed','surprised'].map((x,i)=>`<div class="q"><div class="qrow"><span class="qn">${i+1}</span><div><b>Secret word: ${x}</b><br><textarea data-save="open${i}" placeholder="When I feel like this, …"></textarea><br><button class="secondary" onclick="openExample(this,'${x}')">Show an example</button><div class="example"></div></div></div></div>`).join('')+speak('Personal',[
['Which feeling is difficult for you to deal with?','It is difficult for me to deal with … because …','It is difficult for me to deal with stress because I sometimes forget to take a break.'],
['What are you good at doing when another person is worried?','I’m good at … . I usually …','I’m good at listening. I usually stay calm and give one piece of advice.']]))
html+=card('C','Challenge · Vocabulary Bank 2A',`<p>Use this section if there is enough time. Tap each word after you use it.</p><div class="bank">${chips(['exhausted','calm','upset','frightened','miserable','cheerful','confident','annoyed'])}</div>`+[
['After working all night, I was ___.',['exhausted','cheerful'],'exhausted','This means extremely tired.'],
['She believed she could do the presentation well. She felt ___.',['confident','miserable'],'confident','She believed in her ability.'],
['The cunning player changed the rules. I felt ___.',['annoyed','calm'],'annoyed','This is a little angry or irritated.'],
['The sudden loud noise made the child ___.',['frightened','cheerful'],'frightened','This is similar to afraid.']].map(x=>sel(x[0],x[1],x[2],x[3])).join('')+speak('Challenge',[
['What can make a difficult day feel different?','A difficult day can change when …','A difficult day can change when I spend time with a calm person.']]),'challenge');
const tbFeelings=['afraid','stressed','surprised','worried','angry','bored','excited','happy','relaxed','nervous'];
html+=card('TB','Challenge · Three things',`<p><b>Optional TB p.152 extension.</b> Choose several feelings. Write three things that make you feel each one, then compare your answers.</p><div class="brain">${tbFeelings.map(w=>`<div class="brain-card"><b>Three things that make me feel ${w}</b><input placeholder="1. …"><input placeholder="2. …"><input placeholder="3. …"></div>`).join('')}</div>`+speak('Opinion',[["Which three feelings are easiest to talk about?","The easiest feelings to talk about are … because …","The easiest feelings to talk about are happy, relaxed and excited because I can think of clear examples."],["Do the same things make different people feel different?","I think they do / don’t because …","I think they do because one person may find a journey exciting, while another person feels nervous."]]),'challenge');
document.getElementById('app').innerHTML=html;
function toggleChip(x){x.classList.toggle('used');save()}function hint(b){const q=b.closest('.q'),h=q.querySelector('.hint');h.textContent=q.dataset.hint;h.style.display='block'}function checkOne(b){const q=b.closest('.q'),f=q.querySelector('.feedback'),v=q.querySelector('select').value;if(v===q.dataset.answer){f.textContent='✓ Correct';f.className='feedback good'}else{f.textContent=v?'Not quite. Try the hint.':'Choose an answer first.';f.className='feedback bad'}save()}function example(b){const x=b.nextElementSibling;x.style.display='block'}function openExample(b,w){const x=b.nextElementSibling,examples={nervous:'I have an important appointment in ten minutes, but my bus is delayed.',relaxed:'I finished my work and now I’m listening to quiet music.',surprised:'I opened the door and all my friends were there.'};x.textContent=examples[w];x.style.display='block'}function save(){const values=[...document.querySelectorAll('select,textarea,input')].map(x=>x.value),used=[...document.querySelectorAll('.chip')].map(x=>x.classList.contains('used'));localStorage.setItem(KEY,JSON.stringify({values,used}))}function restore(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');const values=d.values||d;document.querySelectorAll('select,textarea,input').forEach((x,i)=>x.value=values[i]||'');(d.used||[]).forEach((v,i)=>{const chip=document.querySelectorAll('.chip')[i];if(chip)chip.classList.toggle('used',Boolean(v))})}catch(e){}}document.querySelectorAll('.chip').forEach(chip=>{chip.addEventListener('click',()=>toggleChip(chip));chip.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleChip(chip)}})});document.addEventListener('change',save);document.addEventListener('input',save);restore();
</script></body></html>
