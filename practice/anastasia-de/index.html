## Lektion 1 · Kennenlernen und Sprachen
hallo | привет | ___, ich heiße Nina. | Привет, меня зовут Нина.
guten Morgen | доброе утро | Um acht Uhr sage ich: „___!“ | В восемь часов я говорю: «Доброе утро!»
guten Tag | добрый день | Am Nachmittag sage ich: „___!“ | Днём я говорю: «Добрый день!»
guten Abend | добрый вечер | Um 19 Uhr sage ich: „___!“ | В 19 часов я говорю: «Добрый вечер!»
tschüs | пока | Ich gehe nach Hause und sage: „___!“ | Я иду домой и говорю: «Пока!»
auf Wiedersehen | до свидания | Die Kundin geht und sagt: „___!“ | Клиентка уходит и говорит: «До свидания!»
heißen | зваться | Ich ___ Maria. = heiße | Меня зовут Мария.
kommen | приходить; быть родом | Meine Kollegin ___ aus Polen. = kommt | Моя коллега родом из Польши.
wohnen | жить, проживать | Wir ___ in einer kleinen Stadt. = wohnen | Мы живём в небольшом городе.
sprechen | говорить, разговаривать | Mein Nachbar ___ Deutsch. = spricht | Мой сосед говорит по-немецки.
lernen | учить, изучать | Ich ___ jeden Abend Deutsch. = lerne | Я каждый вечер учу немецкий.
sein | быть | Meine Eltern ___ zu Hause. = sind | Мои родители дома.
der Name | имя; название | „Wie ist Ihr ___?“ – „Anna Weber.“ = Name | «Как вас зовут?» — «Анна Вебер».
der Vorname | имя | Mein ___ ist Lisa, mein Familienname ist Müller. = Vorname | Моё имя Лиза, фамилия Мюллер.
der Familienname | фамилия | Mein ___ ist Weber. = Familienname | Моя фамилия Вебер.
das Land | страна | Deutschland ist ein ___. = Land | Германия — страна.
der Wohnort | место проживания | Mein ___ ist Berlin. = Wohnort | Моё место проживания — Берлин.
die Sprache | язык | Deutsch ist eine ___. = Sprache | Немецкий — это язык.
Deutsch | немецкий язык | In Berlin und Wien sprechen die Leute ___. | В Берлине и Вене люди говорят по-немецки.
Englisch | английский язык | In London sprechen die Leute ___. | В Лондоне люди говорят по-английски.
Russisch | русский язык | In Moskau sprechen viele Menschen ___. | В Москве многие говорят по-русски.
Russland | Россия | Moskau liegt in ___. | Москва находится в России.
wie | как | ___ heißt Ihre Tochter? | Как зовут вашу дочь?
wer | кто | ___ ist der Mann auf dem Foto? | Кто этот мужчина на фотографии?
wo | где | ___ ist meine Tasche? | Где моя сумка?
woher | откуда | ___ kommt Ihre Kollegin? | Откуда ваша коллега?
welche | какие; какая | ___ Sprachen sprechen Sie? | На каких языках вы говорите?
der Beruf | профессия | Was ist Ihr ___? = Beruf | Какая у вас профессия?
das Hobby | хобби | Mein ___ ist Fotografieren. = Hobby | Моё хобби — фотография.
zehn | десять | Fünf plus fünf ist ___. | Пять плюс пять — десять.
freut mich | очень приятно | „Ich bin Eva.“ – „___!“ | «Я Ева». — «Очень приятно!»

## Lektion 2 · Berufe und Alltag
der Jurist | юрист | Der ___ arbeitet in einer Kanzlei. = Jurist | Юрист работает в юридической фирме. | img/jurist.jpg
die Juristin | юрист (женщина) | Die ___ berät ihre Klienten. = Juristin | Юристка консультирует своих клиентов. | img/juristin.jpg
der Kellner | официант | Der ___ bringt uns die Speisekarte. = Kellner | Официант приносит нам меню. | img/kellner.jpg
die Kellnerin | официантка | Die ___ bringt zwei Kaffees. = Kellnerin | Официантка приносит два кофе. | img/kellnerin.jpg
der Künstler | художник; деятель искусства | Der ___ malt ein Bild. = Künstler | Художник рисует картину. | img/kuenstler.jpg
der Gast | гость; посетитель | Der ___ bestellt einen Tee. = Gast | Посетитель заказывает чай. | img/gast.jpg
der Patient | пациент | Der ___ wartet beim Arzt. = Patient | Пациент ждёт у врача. | img/patient.jpg
die Kanzlei | юридическая фирма, контора | Die Anwältin arbeitet in einer ___. = Kanzlei | Адвокат работает в юридической конторе.
die Sprachschule | языковая школа | In der ___ lernen wir Deutsch. = Sprachschule | В языковой школе мы учим немецкий.
der Ort | место; населённый пункт | Das ist ein kleiner ___ in Österreich. = Ort | Это маленький населённый пункт в Австрии.
die Straße | улица | Mein Haus steht in dieser ___. = Straße | Мой дом стоит на этой улице. | img/strasse.jpg
die Tür | дверь | Bitte schließen Sie die ___. = Tür | Пожалуйста, закройте дверь. | img/tuer.jpg
das Spiel | игра | Die Kinder spielen ein ___. = Spiel | Дети играют в игру. | img/spiel.jpg
bedienen | обслуживать | Der Kellner ___ die Gäste. = bedient | Официант обслуживает гостей.
untersuchen | обследовать, осматривать | Die Ärztin ___ den Patienten. = untersucht | Врач обследует пациента.
entwickeln | разрабатывать, развивать | Die Firma ___ eine neue App. = entwickelt | Фирма разрабатывает новое приложение.
unterrichten | преподавать | Frau Bauer ___ Deutsch. = unterrichtet | Госпожа Бауэр преподаёт немецкий.
schreiben | писать | Ich ___ eine Nachricht an meine Schwester. = schreibe | Я пишу сообщение сестре.
hören | слышать; слушать | Wir ___ im Kurs einen Dialog. = hören | Мы слушаем диалог на занятии.
schön | красивый | Der Garten ist sehr ___. | Сад очень красивый.
ruhig | спокойный; тихий | Die Bibliothek ist ___. | В библиотеке тихо.
lustig | весёлый; смешной | Der Film ist sehr ___. | Фильм очень смешной.
zusammen | вместе | Meine Freunde wohnen ___. | Мои друзья живут вместе.
verheiratet | женатый; замужняя | Mein Bruder hat eine Frau. Er ist ___. | У моего брата есть жена. Он женат.
das Jahr | год | Ein ___ hat zwölf Monate. = Jahr | В году двенадцать месяцев.
die Ausbildung | профессиональное обучение | Nach der Schule macht sie eine ___ zur Friseurin. = Ausbildung | После школы она учится на парикмахера.
das Frühstück | завтрак | Am Morgen esse ich Brot zum ___. = Frühstück | Утром я ем хлеб на завтрак. | img/fruehstueck.jpg
das Tier | животное | Ein Hund ist ein ___. = Tier | Собака — это животное.
die Stelle | рабочее место; вакансия | Die Firma sucht eine Sekretärin. Die ___ ist noch frei. = Stelle | Фирма ищет секретаря. Вакансия ещё свободна.
die Leute (Pl.) | люди | Auf dem Markt sind viele ___. = Leute | На рынке много людей.
das Mädchen | девочка | Das ___ ist acht Jahre alt. = Mädchen | Девочке восемь лет. | img/maedchen.jpg

## Lektion 3 · Familie und Personen
die Familie | семья | Meine ___ ist klein: meine Mutter, mein Vater und ich. = Familie | Моя семья небольшая: мама, папа и я. | img/familie.jpg
der Bruder | брат | Mein ___ heißt Max und ist 19 Jahre alt. = Bruder | Моего брата зовут Макс, ему 19 лет.
die Schwester | сестра | Meine ___ ist jünger als ich. = Schwester | Моя сестра младше меня.
die Mutter | мать | Meine ___ ist die Frau von meinem Vater. = Mutter | Моя мама — жена моего папы.
der Vater | отец | Mein ___ ist der Mann von meiner Mutter. = Vater | Мой папа — муж моей мамы.
das Haus | дом | Wir wohnen in einem großen ___. = Haus | Мы живём в большом доме. | img/haus.jpg
die Häuser (Pl.) | дома | In dieser Straße stehen viele ___. = Häuser | На этой улице стоит много домов. | img/haeuser.jpg
haben | иметь | Wir ___ zwei Kinder. = haben | У нас двое детей.
wissen | знать (факт) | Ich ___ die Antwort nicht. = weiß | Я не знаю ответа.
mein | мой | Das ist ___ Vater. | Это мой отец.
meine | моя; мои | Das ist ___ Schwester. | Это моя сестра.
dein | твой | Ist das ___ Bruder? | Это твой брат?
nicht | не | Ich komme ___ aus Österreich. | Я не из Австрии.
nein | нет | „Sind Sie Arzt?“ – „___, ich bin Lehrer.“ | «Вы врач?» — «Нет, я учитель».
kein | никакой; не (мужской и средний род) | Ich habe ___ Auto. | У меня нет машины.
keine | никакая; не (женский род и множественное число) | Sie hat ___ Kinder. | У неё нет детей.
doch | нет, наоборот (ответ на отрицательный вопрос) | „Du hast keinen Bruder?“ – „___, ich habe einen!“ | «У тебя нет брата?» — «Нет, есть!»
die Erinnerung | воспоминание | Das Foto ist eine schöne ___ an den Urlaub. = Erinnerung | Эта фотография — приятное воспоминание об отпуске.
erinnern | напоминать; помнить | Ich kann mich an ihren Namen ___. | Я могу вспомнить её имя.
glauben | полагать, верить | Ich ___, der Kurs beginnt um neun Uhr. = glaube | Думаю, занятие начинается в девять.
zuerst | сначала | ___ frühstücke ich, dann gehe ich zur Arbeit. | Сначала я завтракаю, потом иду на работу.
eigen | собственный | Sie hat eine ___ Wohnung. = eigene | У неё собственная квартира.
einfach | простой; просто | Diese Frage ist sehr ___. | Этот вопрос очень простой.

## Lektion 3 · Weitere Wörter aus den Stunden
neu | новый | Das ist mein ___ Computer. = neuer | Это мой новый компьютер.
suchen | искать | Ich ___ meinen Schlüssel. = suche | Я ищу свой ключ.
der Unterricht | урок; занятие | Der ___ beginnt um zehn Uhr. = Unterricht | Занятие начинается в десять часов.
wichtig | важный | Mein Termin beim Arzt ist sehr ___. | Мой приём у врача очень важен.
heute | сегодня | Gestern war Montag, ___ ist Dienstag. | Вчера был понедельник, сегодня вторник.
noch | ещё | Ich habe ___ fünf Minuten Zeit. | У меня есть ещё пять минут.
ein bisschen | немного | Ich verstehe schon ___ Deutsch. | Я уже немного понимаю немецкий.
gar nicht | совсем не | Ich verstehe diese Frage ___. | Я совсем не понимаю этот вопрос.
schlecht | плохой; плохо | Das Wetter ist heute sehr ___. | Сегодня очень плохая погода.
der Handwerker | мастер, рабочий-ремесленник | Der ___ repariert die kaputte Tür. = Handwerker | Мастер чинит сломанную дверь. | img/handwerker.jpg
auch | тоже; также | Meine Schwester lernt Deutsch. Ich lerne ___ Deutsch. | Моя сестра учит немецкий. Я тоже учу немецкий.
singen | петь | Die Kinder ___ ein Lied. = singen | Дети поют песню.
bleiben | оставаться | Am Sonntag ___ wir zu Hause. = bleiben | В воскресенье мы остаёмся дома.
etwas | что-то; немного | Ich möchte ___ trinken. | Я хочу что-нибудь выпить.
treffen | встречать; встречаться | Ich ___ meine Freundin im Café. = treffe | Я встречаюсь с подругой в кафе.
die Hilfe | помощь | Ich verstehe die Aufgabe nicht. Ich brauche ___. = Hilfe | Я не понимаю задание. Мне нужна помощь.
der Samstag | суббота | Nach Freitag kommt ___. = Samstag | После пятницы наступает суббота.
fragen | спрашивать | Ich möchte die Lehrerin etwas ___. | Я хочу кое-что спросить у преподавательницы.
erziehen | воспитывать | Die Eltern ___ ihre Kinder. = erziehen | Родители воспитывают своих детей.
der Erzieher | воспитатель | Der ___ arbeitet im Kindergarten. = Erzieher | Воспитатель работает в детском саду. | img/erzieher.jpg
krank | больной | Paul hat Fieber und bleibt im Bett. Er ist ___. | У Пауля температура, и он остаётся в постели. Он болен.
pflegen | ухаживать | Die Pflegekraft muss die Patienten ___. | Медработник должен ухаживать за пациентами.
der Krankenpfleger | медбрат | Der ___ arbeitet im Krankenhaus und hilft den Patienten. = Krankenpfleger | Медбрат работает в больнице и помогает пациентам. | img/krankenpfleger.jpg
mir | мне | Kannst du ___ bitte helfen? | Ты можешь мне помочь?
sagen | сказать; говорить | Kannst du mir deinen Namen ___? | Можешь сказать мне своё имя?
gehen | идти; ходить | Jeden Morgen ___ wir zu Fuß zur Schule. = gehen | Каждое утро мы ходим в школу пешком.
zum | к; в (сокращение zu dem) | Nach der Arbeit gehe ich ___ Sport. | После работы я иду заниматься спортом.
backen | печь | Am Wochenende möchte ich einen Kuchen ___. | На выходных я хочу испечь пирог.
lesen | читать | Abends möchte ich ein Buch ___. | Вечером я хочу почитать книгу.
antworten | отвечать | Die Lehrerin stellt eine Frage. Ich muss ___. | Преподавательница задаёт вопрос. Я должна ответить.
wohin | куда | ___ gehst du nach dem Unterricht? | Куда ты идёшь после занятия?
die Woche | неделя | Eine ___ hat sieben Tage. = Woche | В неделе семь дней.
