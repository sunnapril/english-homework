// word | meaning | example with ___ (other correct forms after =) | Russian | picture (optional)

## Money · 19.10
live on | have a particular amount of money for your food, rent and other basic costs | Students often have to ___ less than 500 euros a month. | жить на (какую-то сумму)
stock up on | buy a lot of something so that you have it for later | Before the long weekend, we ___ water and batteries. = stocked up on | запасаться
splash out on | spend a lot of money on something enjoyable or special | For our anniversary, we decided to ___ a weekend in a spa hotel. | сильно потратиться на
get into debt | reach a situation in which you owe money | If you use three credit cards at once, it's very easy to ___. | влезть в долги
cut back on | reduce how much you spend or use | I'm trying to ___ takeaway coffee; it costs me a fortune. | сокращать (расходы, потребление)
pay back | return money that you borrowed | Don't worry, I'll ___ the money as soon as I get my salary. | вернуть (долг)
set aside | keep money or time for a particular purpose | Every month he tries to ___ a little money for car repairs. | откладывать
false economy | something that seems cheaper but costs more in the end | Buying the cheapest charger was a ___: it broke in a week. | ложная экономия
with hindsight | thinking about the past with the knowledge you have now | ___, we should have booked the tickets in January. = With hindsight | задним числом, оглядываясь назад
take into account | consider something when you make a decision | When you compare the prices, ___ the delivery costs too. | учитывать

## Precise choices · 26.10
stick to | continue following a plan, rule or decision | It's hard to ___ a budget when your friends keep inviting you out. | придерживаться
estimate | calculate an amount or cost approximately | Can you ___ how long the update will take? | приблизительно оценить
distinguish | recognise the difference between similar things | Some people can't ___ real reviews from fake ones. | различать
lend | give something to someone for a short time and expect it back | Could you ___ me your charger for an hour? | одолжить (кому-то)
enforce | make sure that people obey a rule or law | The new rule is useless if nobody is going to ___ it. | обеспечивать соблюдение
reconsider | think about a decision again and possibly change it | After reading the reviews, I had to ___ my choice of laptop. | пересмотреть
have a flair for | have a natural ability to do something well | My sister has always had a ___ languages. = flair for | иметь талант к
hit it off | like each other immediately after meeting | My new colleague and I ___ on the first day. = hit it off | сразу поладить

## Crime scene · 30.10
sloppy | careless and not thorough | The report was so ___ that the manager had to rewrite half of it. | небрежный
in time | early enough to do something or to prevent a problem | Luckily, the firefighters arrived ___ to save the building. | вовремя
better off | in a better or more comfortable situation | You'd be ___ buying a new phone than repairing this old one. | в лучшем положении
coherent | clear, logical and well organised | She gave a short but ___ explanation of what had happened. | связный, логичный
charged with | officially accused of a crime by the police | The driver was ___ dangerous driving. | обвинённый в
show off | try to impress people with what you have or can do | He only bought that expensive watch to ___. | хвастаться
unspoken rule | a rule that everybody understands, although nobody says it | In our office there's an ___: whoever finishes the coffee makes more. | негласное правило
obnoxious | very unpleasant and rude | The man behind us at the cinema was loud and ___. | отвратительный, невыносимый
concession | something you agree to give or allow in order to end a disagreement | As a ___, the shop offered us free delivery. | уступка
plead not guilty | say officially in court that you did not commit a crime | The suspect decided to ___ and asked for a lawyer. = plead not guilty | не признать вину
evidence | facts or objects that show something is true | The police found no ___ that he had been in the building. | доказательства, улики
convicted of | officially found guilty of a crime in court | She was ___ fraud and sent to prison for two years. | осуждённый за
