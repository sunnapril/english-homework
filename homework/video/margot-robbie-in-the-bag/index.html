STUDENT: ask
HOMEWORK: Video · Margot Robbie: In The Bag
TITLE: Margot Robbie: In The Bag
TAG: Video homework · A2–B1 · about 25 minutes
INTRO: What does a film star carry in her bag? Talk about your own bag first, then watch the Vogue video and answer the questions.

## 1 · Before you watch: your bag
TYPE: open
TEXT: Look at these things. Choose **three** that you always carry and explain why.
- 🔋 a power bank · 👛 a wallet · 🧴 hand sanitizer · 🪞 a mirror · 🔑 keys
TEXT: Then answer two of these questions:
- What do you usually keep in your bag?
- How often do you check what's inside it?
- Do you enjoy shopping for new bags?
- What's the most useful thing to carry in a bag?
SUPPORT: I always carry … because … · I never leave home without … · I check my bag every … · I'd say the most useful thing is … · To be honest, I don't really …
PROMPT: Which three things do you always carry, and why? + answers to two questions

## 2 · Watch the video
TYPE: info
TEXT: Before you watch, read the questions in parts 3–5. Watch the whole video once, then a second time to check your answers.
VIDEO: https://youtu.be/PP496qqtgg8 | Watch: Margot Robbie · In The Bag (Vogue)
TEXT: Worksheet idea: the YouTube channel marie.creates.

## 3 · Quick facts
TYPE: open
TEXT: Answer in a few words.
- 1. Which brand is her bag?
- 2. Does she carry any make-up?
- 3. About how many things are in her bag?
- 4. Does she have a diary with her?
SUPPORT: It's a … bag. · Yes, she has … / No, she doesn't. · About … things. · Yes, she does. / No, she doesn't.
PROMPT: Quick facts 1–4

## 4 · Choose the answer
TYPE: choose
TEXT: Choose the correct answer for each question.
1. What does Margot do with her diary? ___ = She writes everything down in it | options: She never uses it ; She uses an app instead ; She writes everything down in it ; She only writes poems in it
2. Where are her sunglasses from? ___ = Urban Outfitters | options: Chanel ; Gucci ; Urban Outfitters ; Louis Vuitton
3. What does she usually do on a plane? ___ = She watches films | options: She reads scripts ; She works on her laptop ; She watches films ; She sleeps the whole time
4. Why are there teabags in her bag? ___ = She likes one particular brand | options: She likes giving them away ; She works in a café ; She likes one particular brand ; She collects them
5. How does Margot describe her bag? ___ = A lot of things fit in it | options: It's tiny ; A lot of things fit in it ; It's only for special events ; It's too heavy
6. What does she use instead of lip balm? ___ = Baby cream | options: Hand cream ; Face cream ; Baby cream ; Sunscreen

## 5 · True or false?
TYPE: choose
TEXT: Choose True or False.
1. Margot says fashion doesn't interest her. ___ = False | options: True ; False
2. Her bag is full of gadgets. ___ = False | options: True ; False
3. She never uses hand sanitizer. ___ = False | options: True ; False
4. Margot smokes. ___ = False | options: True ; False
5. She carries a special crystal for good luck. ___ = True | options: True ; False

## 6 · Your turn
TYPE: open
TEXT: Answer **three** questions. Write 2–3 sentences for each.
- Is your bag organised like Margot's? How do you organise it?
- Diary or phone: where do you write things down?
- Do you think writing lists is useful? Why / why not?
- Do you carry any of the same things? Is your bag bigger or smaller than hers?
- What is the one thing you can't leave home without?
SUPPORT: Unlike Margot, I … · Just like her, I … · I prefer … because … · In my opinion, lists help you … · I can't leave home without … · My bag is much bigger / smaller than hers.
PROMPT: Your turn: three questions about you and your bag
