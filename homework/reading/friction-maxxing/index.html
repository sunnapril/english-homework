HOMEWORK: Reading · Friction-maxxing
THEME: magazine
ISSUE: Reading room | The November Issue | №4 / 2026
TITLE: The case for *friction*
KICKER: What do we lose when everything becomes effortless?
TAG: Reading homework · B2+ · about 45 minutes
INTRO: Read the article about a new wellbeing trend, work with its vocabulary, articles and quantifiers, then give your opinion. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- Which app or device saves you the most effort every day? Could you live without it for a week?
SUPPORT: The app I rely on most is … · It saves me … · I could probably manage without it, but … · I'd struggle without …

## 2 · The article
TYPE: article
TEXT: We live in an age of almost total convenience. Dinner arrives at the door in thirty minutes, a message reaches the other side of the world in a second, and an endless supply of films and music is always one tap away. Technology has removed thousands of small obstacles from our day. But a growing number of psychologists are asking an awkward question: what happens to a mind that never has to struggle?
TEXT: Their answer has given rise to a trend with a deliberately clumsy name: friction-maxxing. The idea is not to abandon technology, but to put a little effort back into everyday life on purpose: walking instead of driving, assembling a piece of furniture without calling a handyman, or writing a shopping list by hand instead of asking an app to do it.
TEXT: The logic is simple. If every wish is satisfied instantly, we never learn to cope with small doses of boredom or frustration. Yet those moments are often where problem-solving, patience and even creativity come from. Following confusing instructions, getting it wrong and trying again teaches us, in a very practical way, that difficulty is survivable. Psychologists call this building a tolerance for frustration, and they argue that it makes bigger challenges easier to face.
TEXT: Artificial intelligence has made the debate more urgent. In a small but widely discussed study, students who wrote essays with the help of a chatbot later remembered far less of what they had written than those who wrote without any assistance. The researchers were careful not to draw dramatic conclusions, but the message was clear enough: if a machine does our thinking for us, we may slowly lose the habit of thinking for ourselves.
TEXT: Critics point out that friction is easy to romanticise. Convenience gives people time, saves energy for things that matter and makes life far easier for anyone who is tired, busy or unwell. Nobody, they say, should feel guilty for using a dishwasher. Even supporters of the trend agree that the aim is balance, not hardship: start with one small, deliberate inconvenience, rather than throwing away your phone and moving to a cabin in the woods.
VOCAB: convenience | the quality of being easy, quick and requiring little effort
VOCAB: obstacle | something that makes it difficult to do or achieve something
VOCAB: deliberately | on purpose, not by accident
VOCAB: cope with | deal successfully with something difficult
VOCAB: tolerance for frustration | the ability to stay calm and continue when things go wrong
VOCAB: romanticise | describe something as better or more attractive than it really is

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if it says the opposite, and **Not stated** if the article doesn't say it.
1. Friction-maxxing encourages people to stop using technology completely. = False | options: True ; False ; Not stated | hint: Paragraph 2: "The idea is not to …"
2. According to psychologists, small amounts of frustration can lead to creativity. = True | options: True ; False ; Not stated
3. In the study, students who used a chatbot remembered more of their essays. = False | options: True ; False ; Not stated
4. The researchers claimed that AI permanently damages the brain. = False | options: True ; False ; Not stated | hint: "The researchers were careful not to …"
5. Friction-maxxing was invented by a famous psychologist. = Not stated | options: True ; False ; Not stated
6. Critics believe convenience can help people who are ill or exhausted. = True | options: True ; False ; Not stated

## 4 · Word forms
TYPE: gap
TEXT: Use the word in CAPITALS to form a word that fits the gap.
1. Online banking is a huge ___ for people who work long hours. (CONVENIENT) = convenience | hint: A noun.
2. Waiting in a long queue is a minor ___, not a disaster. (CONVENIENT) = inconvenience | hint: A noun with the opposite meaning: add a prefix.
3. She ___ left her phone at home to see if she could manage without it. (DELIBERATE) = deliberately | hint: An adverb.
4. Assembling the wardrobe was more ___ than I expected. (FRUSTRATE) = frustrating | hint: An adjective describing the activity.
5. Being bored now and then can boost your ___. (CREATE) = creativity | hint: A noun.
6. Too much ___ on apps can make simple tasks feel difficult. (RELY) = reliance ; dependence | hint: A noun ending in -ance.
7. Her ___ to keep trying impressed everyone in the team. (DETERMINE) = determination | hint: A noun ending in -tion.

## 5 · Articles and countability
TYPE: choose
TEXT: These sentences practise the areas from your last homework. Choose the correct option.
1. Delivery apps bring ___ benefits to busy families. = significant | options: significant ; a significant ; the significant ; a big | hint: Benefits is plural, so no a/an.
2. If the instructions are unclear, it could be ___ problem. = a | options: a ; the ; — ; an | hint: A singular countable noun needs an article.
3. Building furniture yourself doesn't need ___ special equipment. = much | options: much ; many ; a few ; several | hint: Equipment is uncountable.
4. Writing by hand saves ___ resources than you might think. = fewer | options: fewer ; less ; much ; little | hint: Resources is plural and countable.
5. I don't have ___ clear answer to this question yet. = a | options: a ; the ; — ; any | hint: Answer is a singular countable noun.
6. ___ of my colleagues have deleted social media from their phones; most of them still use it. = A few | options: A few ; A little ; Much ; Every | hint: A small number, used with a plural countable noun.
7. Too ___ convenience can make us impatient. = much | options: much ; many ; few ; a lot | hint: Convenience is uncountable.

## 6 · Natural collocations
TYPE: gap
TEXT: Complete the collocations from the article. The first letter is given.
1. The idea is to put a little effort back into everyday life ___ (o…) purpose. = on | hint: deliberately = on …
2. The new trend has ___ (g…) rise to many online challenges. = given | hint: give rise to = cause something to begin.
3. It's important not to ___ (d…) dramatic conclusions from one small study. = draw | hint: … a conclusion
4. Many people ___ (r…) on their phones to remember everything. = rely | hint: depend on
5. Learning to ___ (c…) with frustration takes time. = cope | hint: deal successfully with
6. I'm not against technology: I just think it should help us, not ___ (t…) for us. = think | hint: The article says machines may do this for us.
