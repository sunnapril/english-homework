STUDENT: ask
HOMEWORK: Reading · Strong at any age
THEME: magazine
ISSUE: Reading room | The November Issue | №6 / 2026
TITLE: Strong at *any age*
KICKER: Why more and more women are lifting weights
TAG: Reading homework · A2+ · about 30 minutes
INTRO: Read a short article about sport and health, learn its key words, practise comparatives and write about your own sport. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- What sport do you do? How often? Do you like going to the gym?
SUPPORT: I usually … · I go … times a week. · I like … , but I don't like … · I've never tried …
PROMPT: What sport do you do, how often, and do you like the gym?

## 2 · The article
TYPE: article
TEXT: For many years, a lot of women did only cardio: running, aerobics and long walks. Many of them were afraid of heavy weights. "I don't want big muscles," they said.
TEXT: Today, doctors say this is a mistake. Strong muscles are very good for our health. They protect our bones and joints, help the heart and help us stay active when we are older. Some studies show that people with stronger muscles often live longer, too.
TEXT: The good news is that it's never too late to start. One woman started lifting weights at home when she was 49, with an old pair of dumbbells from her father. At first, one workout took her two hours because she didn't know what to do. Three years later, she was much stronger and felt better than ever. Some doctors even tell stories about women who started in their eighties.
TEXT: How can you start? You don't need an expensive gym. At the beginning, two short workouts a week are enough. Exercises like squats work many muscles at the same time. If you can, book one or two sessions with a trainer. If not, there are lots of free videos online. Some trainers give a funny tip: film yourself, then watch the video and check your position.
TEXT: And what about big muscles? Experts say most women can't build very big muscles by accident: it's difficult even for professional athletes. So maybe the real question is not "Will I look too big?" but "How strong do I want to be?"
VOCAB: muscle | the part of your body that helps you move and lift things
VOCAB: lift weights | do exercises with heavy objects to get stronger
VOCAB: dumbbell | a short bar with a weight at each end
VOCAB: workout | a session of physical exercise
VOCAB: trainer | a person who teaches you how to do exercises
VOCAB: it's never too late | you can still start, even if you are older

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if it says the opposite, and **Not stated** if the article doesn't say it.
1. In the past, many women were afraid of heavy weights. = True | options: True ; False ; Not stated
2. Doctors say strong muscles are bad for the heart. = False | options: True ; False ; Not stated | hint: Paragraph 2: "… help the heart".
3. The woman from the article started lifting weights in an expensive gym. = False | options: True ; False ; Not stated | hint: Where did she start? With what?
4. At the beginning, two short workouts a week are enough. = True | options: True ; False ; Not stated
5. The article says that yoga is better than lifting weights. = Not stated | options: True ; False ; Not stated | hint: Does the article talk about yoga?

## 4 · Words from the article
TYPE: gap
TEXT: Complete the sentences with words from the bank. There is **one extra word**.
BANK: muscles; workout; trainer; dumbbells; lift weights; never too late; position; joints
1. After a long ___, I always drink a lot of water. = workout | hint: A session of exercise.
2. My ___ shows me every new exercise and checks that I do it correctly. = trainer
3. I bought two small ___ to do exercises at home. = dumbbells
4. My grandfather learned to swim at 70. It's ___! = never too late
5. Climbing stairs every day makes the leg ___ stronger. = muscles
6. She goes to the gym to ___ three times a week. = lift weights
7. Keep your back straight: a wrong ___ can hurt your back. = position

## 5 · Comparatives
TYPE: choose
TEXT: Choose the correct form.
1. After three years, she was much ___ than before. = stronger | options: stronger ; more strong ; strongest ; more stronger
2. A short workout is ___ than no workout. = better | options: better ; gooder ; more good ; best
3. A personal trainer is ___ than free videos online. = more expensive | options: more expensive ; expensiver ; most expensive ; more expensiver
4. For me, swimming is ___ running. = more fun than | options: more fun than ; funner that ; more fun that ; the most fun
5. Lifting weights isn't as ___ as people think. = difficult | options: difficult ; more difficult ; difficulter ; the most difficult | hint: as + adjective + as
6. My sister is ___ person in our family: she runs every morning. = the sportiest ; the most sporty | options: the sportiest ; sportier ; more sporty ; the sportier | hint: One person compared with the whole family: superlative.

## 6 · Your turn
TYPE: open
TEXT: Write **40–60 words**. Use **two** words from part 4 and **two** comparatives.
- What sport do you do now, and what did you do as a teenager? Which is more fun, and which is more difficult? Would you like to try lifting weights?
SUPPORT: As a teenager, I … · Now I … · … is more fun than … · … is harder / easier than … · I'd like to try … because … · I'm not sure about … because …
PROMPT: Your sport now and as a teenager — compare them (40–60 words)
