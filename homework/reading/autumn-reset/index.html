STUDENT: ask
HOMEWORK: Reading · Autumn reset
THEME: magazine
ISSUE: Reading room | The Autumn Issue | №1 / 2026
TITLE: Autumn *reset*
KICKER: Is autumn a better time for a fresh start than January?
TAG: Reading homework · B1+ · about 40 minutes
INTRO: Read the article, practise its key language and write your own answer. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- When do you usually start something new: in January, in September, or at any time? Why?
SUPPORT: I usually start … in … · For me, the best time is … because … · To be honest, I don't wait for a special date. · I tried to … but …
PROMPT: When do you usually start something new, and why?

## 2 · The article
TYPE: article
IMAGE: autumn-desk.jpg | A desk by a window in autumn: an open notebook with a pencil, a cup of tea, a plant and a wall calendar; orange leaves are falling outside.
TEXT: Every January, millions of people make New Year's resolutions. They promise themselves they will exercise more, eat more healthily or finally learn a language. Yet by the middle of February, many of these resolutions have quietly faded away. So some people on social media have come up with a different approach. They call it the "October Theory", or simply an autumn reset.
TEXT: The idea is that you don't wait for the first of January. Instead, you use the last three months of the year to build new routines, so that by the time the holidays arrive, the change is already part of your life.
TEXT: Supporters give several reasons why this works. First, autumn has always felt like a new beginning: for years, September meant a new school year, new notebooks and a new timetable, and many adults still associate this season with learning. Second, as the evenings get darker, we tend to spend more time indoors, which gives us time for a course, a book or a regular workout. Third, the end of the year is a natural moment to look back, reflect on what has gone well and leave behind what hasn't. Rather than making a long list of promises on 31 December, you set one realistic goal now and stick to it.
TEXT: Not everyone is convinced, though. Critics argue that the trend is just another form of pressure, a way of making people feel they are never good enough. Why should we need a special month to improve ourselves? Others point out that autumn is a difficult season for many: shorter days can leave people feeling tired and unmotivated, which is hardly the best moment for big changes.
TEXT: Perhaps the real question isn't whether October is better than January. It's whether we are ready to take the first step, and then to keep going when the excitement wears off.
VOCAB: a fresh start | a new opportunity to begin again
VOCAB: fade away | slowly become weaker and disappear
VOCAB: reflect on | think carefully about something
VOCAB: leave something behind | stop doing or thinking about something from the past
VOCAB: stick to | continue doing what you planned, even when it's hard
VOCAB: wear off | slowly stop (about a feeling or an effect)

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if it says the opposite, and **Not stated** if the article doesn't say it.
1. According to the article, many New Year's resolutions don't last long. = True | options: True ; False ; Not stated | hint: Paragraph 1: what happens by the middle of February?
2. The October Theory suggests waiting until January to make big changes. = False | options: True ; False ; Not stated
3. Many adults still connect autumn with learning. = True | options: True ; False ; Not stated | hint: Paragraph 3, the first reason.
4. The article says people go outside more often in autumn. = False | options: True ; False ; Not stated | hint: As the evenings get darker, we …
5. The October Theory was started by a well-known psychologist. = Not stated | options: True ; False ; Not stated | hint: Does the article say who started it?
6. Critics believe the trend can make people feel under pressure. = True | options: True ; False ; Not stated

## 4 · The right word in the right form
TYPE: gap
TEXT: Complete the sentences with words from the article. The first letter is given. Change the form if necessary (*stick → stuck*, *reflect → reflecting*).
1. Zhenya wrote her goal on a sticky note and has ___ (s…) it for three months now. = stuck to | hint: Continue doing what you planned. Present perfect: has + past participle.
2. Coffee helps me in the morning, but the effect usually ___ (w…) after two hours. = wears off | hint: Slowly stops (about an effect). Present simple, he / she / it.
3. After a difficult year, Oleg moved to Kazan to make ___ (a f…). = a fresh start | hint: A new opportunity to begin again.
4. I spent the whole evening ___ (r…) the mistakes I'd made at work. = reflecting on | hint: Thinking carefully about something. spend time + -ing.
5. Moving to a new city helped him ___ (l…) a very hard period of his life. = leave behind | hint: Stop thinking about something from the past.
6. At first we loved our new gym, but our enthusiasm slowly ___ (f…). = faded away ; faded | hint: Became weaker and disappeared.
7. I always ___ (a…) the smell of cinnamon with my grandmother's kitchen. = associate | hint: Connect two things in your mind.
8. Sport is part of my daily ___ (r…): I run every morning before work. = routine | hint: Things you do regularly, usually in the same order.
9. Many students feel a lot of ___ (p…) before their final exams. = pressure | hint: The feeling that you must do well or must do something.
10. Losing twenty kilos in one month isn't a ___ (r…) goal. = realistic | hint: Possible to achieve.

## 5 · Which verb goes with the goal?
TYPE: choose
TEXT: Choose the verb that goes with the noun. These combinations are very common when we talk about goals and habits.
1. Every January she ___ a resolution, and every February she forgets about it. = makes | options: makes ; does ; takes ; puts
2. It's much easier to ___ a goal than to reach it. = set | options: set ; do ; take ; give
3. Don't try to change everything at once: ___ one small step at a time. = take | options: take ; make ; do ; go
4. If you want to ___ a new habit, practise it at the same time every day. = form | options: form ; do ; take ; put
5. He promised to stop eating sweets, but he ___ his promise after two days. = broke | options: broke ; lost ; missed ; dropped

## 6 · If I could start again …
TYPE: choose
TEXT: Choose the correct form of the **second conditional**: an imagined situation now or in the future.
1. If I ___ more free time, I would learn to play the guitar. = had | options: had ; have ; would have ; will have | hint: If + past simple.
2. If she started now, she ___ a new habit by January. = would have | options: would have ; will have ; has ; is having | hint: Result: would + verb.
3. What ___ you change if you could restart one area of your life? = would | options: would ; will ; do ; did
4. I would go to the gym before work if it ___ so dark in the morning. = weren't | options: weren't ; isn't ; won't be ; hasn't been | hint: If + past simple (were / weren't is possible for all persons).
5. If you ___ one bad habit tomorrow, which one would it be? = could stop | options: could stop ; can stop ; will stop ; have stopped | hint: could = would be able to.
6. We ___ so tired in November if we went to bed earlier. = wouldn't feel | options: wouldn't feel ; won't feel ; don't feel ; didn't feel

## 7 · Let's discuss: your answer
TYPE: open
TEXT: Choose **one** question and write **80–100 words**. Use at least **three** words or phrases from the *New vocabulary* box or part 4, and **one** sentence with *If I …, I would …*
- **A.** If you could restart one area of your life this autumn, what would you choose and why?
- **B.** Is there a habit you'd like to leave behind before the end of the year? What would you replace it with?
- **C.** How does your motivation change with the seasons? When do you feel most productive?
SUPPORT: If I could restart …, I would … · I'd like to leave behind … · Instead, I would … · The first step would be … · The hardest part is sticking to … · I feel most productive in … because … · To be honest, …
PROMPT: Your answer to question A, B or C (80–100 words)
