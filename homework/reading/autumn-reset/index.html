STUDENT: ask
HOMEWORK: Reading · Autumn reset
TITLE: Autumn reset: why wait for January?
TAG: Reading homework · B1 · about 30 minutes
INTRO: Read a short article about a social media trend, practise its key phrases and the second conditional, then write your own answer. Please do everything on one device: your answers are saved only there. You can write the long answer in your own document first and paste it in.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- When do you usually start something new: in January, in September, or at any time? Why?
SUPPORT: I usually start … in … · For me, the best time is … because … · To be honest, I don't wait for a special date. · I tried to … but …
PROMPT: When do you usually start something new, and why?

## 2 · Read the article
TYPE: info
TEXT: **Autumn reset: why wait for January?**
TEXT: Every January, millions of people make New Year's resolutions: to exercise more, eat better or learn a new language. By February, many of them have already given up. So some people on social media have a different idea. They call it the "October Theory", or simply an autumn reset.
TEXT: The idea is simple. You don't wait for the first of January. You start making changes in the last three months of the year. There are a few reasons why this might work better.
TEXT: First, autumn feels like a new beginning for many of us. For years, September meant a new school year, new notebooks and a new timetable, and that feeling often stays with us as adults. Second, the evenings get dark early, so we spend more time at home. That time can be used for a course, a book or a regular workout. Third, the end of the year is a natural moment to reflect on what has gone well and to leave behind the things that didn't work. If you start now, you won't arrive in January with a long list of promises: you'll already have a new habit.
TEXT: Not everyone likes the idea, though. Critics say it is just another way to make people feel they are never good enough. Why do we need a special month to change? If you want to start something, you can start on any ordinary Tuesday. Others say autumn is a bad time for big changes, because many people feel tired and less motivated when the days get shorter.
TEXT: Maybe the date is not that important. A fresh start in October, in January or on an ordinary Tuesday only works if you actually take the first step, and then the second one.

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if the article says the opposite, and **Not stated** if the article doesn't say it.
1. Most people keep their New Year's resolutions for the whole year. = False | options: True ; False ; Not stated | hint: Look at the first paragraph: what happens by February?
2. The October Theory says you should start changing things before January. = True | options: True ; False ; Not stated
3. For many adults, autumn still feels like the start of a school year. = True | options: True ; False ; Not stated | hint: Paragraph 3, the first reason.
4. According to the article, people spend more time outdoors in autumn. = False | options: True ; False ; Not stated | hint: The evenings get dark early, so …
5. A famous psychologist invented the October Theory. = Not stated | options: True ; False ; Not stated | hint: Does the article say who invented it?
6. Some critics think autumn is a difficult time for big changes. = True | options: True ; False ; Not stated

## 4 · Phrases from the article
TYPE: gap
TEXT: Complete each sentence with one phrase from the bank. Use every phrase once.
BANK: a fresh start; reflect on; give up; take the first step; habit; motivated; timetable
1. After he lost his job, Anton moved to a new city for ___. = a fresh start | hint: A new beginning.
2. At the end of every year, I like to ___ what I have learned. = reflect on | hint: Think carefully about something.
3. Don't ___ after one bad week. Keep practising! = give up | hint: Stop trying.
4. I wanted to learn Spanish for years, and yesterday I finally decided to ___ and booked my first lesson. = take the first step | hint: Begin doing something.
5. Checking my phone right after I wake up is a bad ___. = habit | hint: Something you do regularly, often without thinking.
6. When the days are short and dark, it's hard to stay ___. = motivated | hint: Wanting to do something and having the energy for it.
7. According to the new school ___, there are two English lessons a week. = timetable | hint: A plan showing when lessons happen.

## 5 · If I could start again …
TYPE: choose
TEXT: The article asks what you would change. Choose the correct form of the **second conditional** (an imagined situation now or in the future).
1. If I ___ more free time, I would learn to play the guitar. = had | options: had ; have ; would have ; will have | hint: If + past simple.
2. If she started now, she ___ a new habit by January. = would have | options: would have ; will have ; has ; is having | hint: Result: would + verb.
3. What ___ you change if you could restart one area of your life? = would | options: would ; will ; do ; did
4. I would go to the gym in the morning if it ___ so dark. = weren't | options: weren't ; isn't ; won't be ; hasn't been | hint: If + past simple (were / weren't is possible for all persons).
5. If you ___ one bad habit tomorrow, which one would it be? = could stop | options: could stop ; can stop ; will stop ; have stopped | hint: could = would be able to.
6. We ___ so tired in November if we went to bed earlier. = wouldn't feel | options: wouldn't feel ; won't feel ; don't feel ; didn't feel

## 6 · Your turn
TYPE: open
TEXT: Choose **one** question and write **60–80 words**. Use at least **two** phrases from part 4 and **one** sentence with *If I … , I would …*
- **A.** If you could restart one area of your life this autumn, what would you choose and why?
- **B.** Is there a habit you'd like to leave behind before the end of the year? What would you replace it with?
- **C.** When do you feel most motivated: in autumn, winter, spring or summer? Why?
SUPPORT: If I could restart …, I would … · I'd like to leave behind … · Instead, I would … · The first step would be … · I feel most motivated in … because … · To be honest, …
PROMPT: Your answer to question A, B or C (60–80 words)
