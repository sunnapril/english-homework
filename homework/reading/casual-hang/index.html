STUDENT: ask
HOMEWORK: Reading · Whatever happened to the casual hang?
THEME: magazine
ISSUE: Reading room | The November Issue | №3 / 2026
TITLE: Whatever happened to the *casual hang*?
KICKER: Why do we need a calendar to see our friends?
TAG: Reading homework · B1+ · about 40 minutes
INTRO: Read the article, practise its key language and write about your own friendships. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- When did you last meet a friend without planning it in advance? What did you do?
SUPPORT: The last time I … was … · We just … · To be honest, I can't remember … · Usually we plan … in advance.
PROMPT: When did you last meet a friend without planning it, and what did you do?

## 2 · The article
TYPE: article
TEXT: "Are you free tonight?" When did someone last ask you this question and get a simple yes? For many of us, meeting a friend has turned into a project. We send messages for days, compare calendars and finally agree on a Saturday in three weeks' time. Then somebody cancels, and the whole process starts again.
TEXT: It wasn't always like this. When our parents were young, people used to drop in on their neighbours, call a friend in the evening and meet half an hour later, or simply sit on a bench in the yard and see who came by. Nobody needed a reservation to drink tea in a friend's kitchen. Today we are more connected than ever online, yet many people say they see their friends less often than they would like.
TEXT: There are several reasons for this. Work and study take up most of the week, and many people feel they must put their partner, family or job first, so friendship moves to the bottom of the list. Cities have grown, and getting from one side of town to the other can take an hour. Many young people live in small flats or share a home, so it is hard to invite guests. As a result, meeting friends often means going to a café or a restaurant, which costs money and has to be booked in advance.
TEXT: Some people believe the answer is not to plan bigger meetings, but smaller ones. Instead of waiting for the perfect evening, you can invite a friend for a twenty-minute walk during your lunch break, go to the supermarket together or ask them to join you when you walk the dog. These short meetings don't look special, but they keep a friendship alive.
TEXT: Of course, a carefully planned dinner can be wonderful. But maybe we should also leave a little space for the unplanned: the coffee that turns into a long conversation, the walk that ends with a plan for the summer. So, is anyone free tonight?
VOCAB: casual | relaxed and informal, not planned or special
VOCAB: drop in on someone | visit someone without arranging it first
VOCAB: in advance | before something happens
VOCAB: put someone first | treat someone as the most important
VOCAB: book | arrange to have a table, ticket or room
VOCAB: keep something alive | make sure something continues

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if it says the opposite, and **Not stated** if the article doesn't say it.
1. According to the article, many people now plan meetings with friends weeks ahead. = True | options: True ; False ; Not stated | hint: Paragraph 1: "a Saturday in three weeks' time".
2. In the past, people always booked a table before meeting friends. = False | options: True ; False ; Not stated | hint: Paragraph 2: what did people use to do?
3. The article says people see their friends less often because of social media. = Not stated | options: True ; False ; Not stated | hint: Look at the reasons in paragraph 3. Is social media one of them?
4. Small flats make it difficult to invite friends home. = True | options: True ; False ; Not stated
5. The author thinks planned dinners with friends are a bad idea. = False | options: True ; False ; Not stated | hint: Last paragraph: "a carefully planned dinner can be …"
6. Some people suggest short, simple meetings instead of waiting for a perfect evening. = True | options: True ; False ; Not stated

## 4 · Phrases from the article
TYPE: gap
TEXT: Complete the sentences. The first letter is given. Change the form if necessary.
1. My grandmother loved it when neighbours ___ (d…) her without calling first. = dropped in on | hint: Visit without arranging it first. Past simple.
2. The concert is very popular, so you need to buy tickets ___ (i…). = in advance | hint: Before something happens.
3. Can you ___ (b…) a table for four for Friday evening? = book | hint: Arrange to have a table.
4. It's just a ___ (c…) party: jeans and T-shirts are fine. = casual | hint: Relaxed and informal.
5. With work, study and family, it's hard to ___ (p…) sometimes. = put friendship first ; put your friendship first ; put our friendship first | hint: Treat friendship as the most important thing. Type the whole phrase.
6. Long phone calls helped us ___ (k…) when we lived in different cities. = keep our friendship alive ; keep the friendship alive | hint: Make our friendship continue. Type the whole phrase.
7. Two friends ___ (c…) at the last minute, so we were only three at dinner. = cancelled ; canceled | hint: Said they would not come after all.

## 5 · Then and now: used to
TYPE: choose
TEXT: The article compares the past and the present. Choose the correct form.
1. When I was a student, I ___ my friends almost every evening. = used to see | options: used to see ; use to see ; am used to see ; was used to seeing | hint: used to + verb = a past habit.
2. Did your parents ___ visit their neighbours without calling? = use to | options: use to ; used to ; using to ; uses to | hint: In questions with did: use to (no -d).
3. We ___ to book a table: we just went to the café and sat down. = didn't use | options: didn't use ; don't use ; didn't used ; weren't use
4. These days I ___ my friends at the weekend because I work a lot. = usually see | options: usually see ; used to see ; am used see ; use to see | hint: A present habit: Present Simple.
5. Next Saturday I ___ my old school friend at a new café. = 'm meeting ; am meeting | options: 'm meeting ; used to meet ; meet usually ; am used to meet | hint: A fixed plan for the future: Present Continuous.

## 6 · Let's discuss: your answer
TYPE: open
TEXT: Choose **one** question and write **80–100 words**. Use at least **three** phrases from the *New vocabulary* box or part 4, and **one** sentence with *used to*.
- **A.** How did you meet your friends five or ten years ago, and how do you meet them now? What has changed?
- **B.** Plan a 20-minute "casual hang" with a friend this week. Where will you go, what will you do, and why does it work for both of you?
- **C.** Is it really a problem that we plan meetings in advance? Give your opinion with one example from your life.
SUPPORT: I used to … , but now … · These days we usually … · It's hard to … because … · Instead of … , we could … · To be honest, … · For me, the best way to keep a friendship alive is …
PROMPT: Your answer to question A, B or C (80–100 words)
