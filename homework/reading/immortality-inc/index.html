STUDENT: ask
HOMEWORK: Reading · Immortality, Inc.
THEME: magazine
ISSUE: Reading room | The November Issue | №5 / 2026
TITLE: Immortality, *Inc.*
KICKER: Can you buy yourself a longer life?
TAG: Reading homework · B2+ · about 45 minutes
INTRO: Read the article about the booming longevity industry, work with its vocabulary and the passive, then give your opinion. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- Would you like to live to 120? What would you be willing to do, or pay, to get there?
SUPPORT: I'd (not) like to … because … · I'd be willing to … , but I wouldn't … · Living longer only makes sense if … · Honestly, …
PROMPT: Would you like to live to 120, and what would you be willing to do for it?

## 2 · The article
TYPE: article
TEXT: For years, the magic word was wellness: green smoothies, yoga mats and meditation apps. Now a new and more ambitious word has taken its place: longevity. It is no longer enough to feel calm and healthy. The goal, we are told, is to optimise, measure and "biohack" our way to a life that is not only longer, but healthier for longer, a concept the industry calls "health span".
TEXT: The basic recipe has hardly changed: eat well, move every day, sleep enough and keep stress under control. Our grandmothers could have told us that for free. But on top of these simple habits, an expensive new layer has appeared: daily handfuls of supplements, regular blood tests, red-light masks, oxygen chambers and clinics that promise to make your cells "younger". Luxury hotels now offer longevity retreats, and some face creams are sold for the price of a second-hand car.
TEXT: Perhaps the strangest part is how competitive it has become. One well-known tech entrepreneur, who reportedly spends millions of dollars a year on his own anti-ageing programme, runs a public ranking where people can upload their "biological age" and compare it with others. Ageing has been turned into a sport, and if you age badly, the message seems to be, you simply didn't try hard enough.
TEXT: Critics argue that this is the real problem. A natural wish to live well has been packaged as a product and sold back to us, together with a new reason to feel guilty. Interestingly, the places where people really do live the longest, sometimes called "Blue Zones", have very little to do with gadgets. People there eat simple food, walk a lot and spend time with friends and family. One path requires a laboratory; the other requires beans and good neighbours.
TEXT: None of this means that longevity science is nonsense. Some research is genuinely promising, and sleep, exercise and friendship are clearly worth investing in. The question is whether a longer life is something that can be bought, or whether, as one old joke suggests, the secret is simply to stop arguing with everyone.
VOCAB: longevity | living for a long time
VOCAB: optimise | make something as good or effective as possible
VOCAB: supplement | a pill or powder taken to add vitamins or nutrients
VOCAB: retreat | a quiet place or trip for rest and recovery
VOCAB: promising | likely to be successful or useful
VOCAB: be worth (doing) | be useful or good enough to spend time or money on

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if it says the opposite, and **Not stated** if the article doesn't say it.
1. "Health span" means living longer and staying healthy during those years. = True | options: True ; False ; Not stated
2. The basic advice for a long life has changed completely in recent years. = False | options: True ; False ; Not stated | hint: Paragraph 2: "The basic recipe has hardly changed."
3. Longevity supplements have been proven to add ten years to people's lives. = Not stated | options: True ; False ; Not stated
4. In the public ranking, people compare their biological age with each other. = True | options: True ; False ; Not stated
5. People in Blue Zones rely on expensive technology to stay healthy. = False | options: True ; False ; Not stated
6. The author believes that all longevity science is useless. = False | options: True ; False ; Not stated | hint: Last paragraph: "None of this means …"

## 4 · Vocabulary in new contexts
TYPE: gap
TEXT: Complete the sentences with words from the article. The first letter is given. Change the form if necessary.
1. Our team spent a week trying to ___ (o…) the app so that it loads twice as fast. = optimise ; optimize | hint: Make it as effective as possible.
2. My doctor said I don't need any vitamin ___ (s…) if I eat a balanced diet. = supplements | hint: Plural.
3. The company took all its managers on a two-day ___ (r…) in the mountains. = retreat | hint: A quiet trip for rest and planning.
4. The first results of the new treatment look very ___ (p…). = promising | hint: Likely to be successful.
5. The old part of the city is definitely ___ (w…) visiting. = worth | hint: be … doing
6. Tortoises are famous for their ___ (l…): some live for over 150 years. = longevity | hint: Living for a long time.
7. Fitness trackers have ___ (t…) walking into a competition between colleagues. = turned | hint: … something into something

## 5 · The passive
TYPE: gap
TEXT: The article uses many passive forms (*we are told, has been turned, are sold*). Rewrite each sentence in the passive. Type only the missing verb form.
1. Clinics sell expensive anti-ageing treatments. → Expensive anti-ageing treatments ___ by clinics. = are sold | hint: Present simple passive.
2. Marketers have packaged a natural wish as a product. → A natural wish ___ as a product. = has been packaged | hint: Present perfect passive.
3. The entrepreneur reportedly spends millions on his programme. → Millions ___ to be spent on his programme. = are reported ; are said | hint: Reporting passive: are + past participle + to be …
4. Scientists will test the new supplement next year. → The new supplement ___ next year. = will be tested | hint: Future passive.
5. Somebody has to check your blood every three months. → Your blood ___ every three months. = has to be checked | hint: has to + be + past participle.
6. People believe that the Blue Zone diet helped them live longer. → The Blue Zone diet ___ them live longer. = is believed to have helped | hint: The belief is now, the action is in the past: to have + past participle.

## 6 · Articles and countability
TYPE: choose
TEXT: Choose the correct option.
1. She spends ___ money on supplements every month. = a lot of | options: a lot of ; many ; a few ; several | hint: Money is uncountable.
2. Sleep is ___ cheapest way to stay healthy. = the | options: the ; a ; — ; an | hint: A superlative.
3. He takes ___ vitamin pills every morning. = several | options: several ; much ; a little ; little of | hint: Pills are countable.
4. There isn't ___ evidence that these creams make cells younger. = much | options: much ; many ; a few ; several | hint: Evidence is uncountable.
5. Walking with friends is ___ simple habit that really works. = a | options: a ; the ; — ; an | hint: First mention, singular countable noun.

## 7 · Let's discuss: your opinion
TYPE: open
TEXT: Write **150–180 words**.
- Is the longevity industry a real step forward for health, or mainly a way to make money from our fears?
- Give **two** arguments and suggest what **you** would actually do to stay healthy for longer.
- Use **at least three** passive forms (one reporting passive, e.g. *is said to*, *is believed to*) and **three** words from parts 4–5.
SUPPORT: It is often claimed that … · On the one hand, … · On the other hand, … · What I find particularly worrying is that … · Another point is that … · Personally, I would rather … · All things considered, …
PROMPT: Is the longevity industry a step forward for health or mainly a business? (150–180 words)
