STUDENT: ask
HOMEWORK: Reading · The Cost of Halloween
THEME: magazine
ISSUE: Reading room | The Autumn Issue | №2 / 2026
TITLE: The Cost of *Halloween*
KICKER: What happens to all those pumpkins on 1 November?
TAG: Reading homework · B2+ · about 45 minutes
INTRO: Read the article, work with its vocabulary and the passive, then give your opinion. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- What usually happens to decorations, flowers or leftover food in your home after a celebration?
SUPPORT: After a celebration, we usually … · Most of it ends up … · We try to … · To be honest, a lot of it gets thrown away.
PROMPT: What happens to decorations or leftover food in your home after a celebration?

## 2 · The article
TYPE: article
TEXT: On 31 October, pumpkins are the undisputed stars of the show. Carved into grinning faces and lit from within, they sit on doorsteps and windowsills in many parts of the world. A week later, the same pumpkins are soft, grey and forgotten, and a great many of them are quietly thrown away.
TEXT: The scale of the problem is easy to underestimate. In 2025 alone, around 1.5 billion pounds of pumpkins (almost 700,000 tonnes) were grown in the United States, and a large proportion of them were bought not to be eaten, but to be looked at.
TEXT: The real trouble begins once they reach a landfill. Buried beneath layers of other rubbish and starved of oxygen, the pumpkin flesh decomposes and releases methane, a greenhouse gas that is estimated to be around 80 times as powerful as carbon dioxide over a twenty-year period. A single pumpkin may seem insignificant, but multiplied across millions of households, the waste becomes much harder to ignore.
TEXT: Simply telling people to compost their pumpkins is not the whole answer, either. Composting facilities have not been set up in every town, and pumpkins that have been painted, sprayed with glitter or filled with candle wax cannot always be processed safely. Nor is dumping them in the woods a responsible shortcut: although it may feel like a gift to wildlife, experts warn that it can disrupt local ecosystems and lure animals towards roads and homes.
TEXT: An undecorated pumpkin, by contrast, has plenty of second lives. It can be turned into soup or pie, its seeds can be roasted for a snack, and whatever is left can be donated to a farm or sent to a proper composting site.
TEXT: Ultimately, the pumpkin problem raises a broader question about our throwaway habits: why do we grow, buy and display food for a few days, only to throw it away? Making Halloween more sustainable may not mean abandoning the tradition, but rethinking the waste hidden behind it.
VOCAB: landfill | a place where rubbish is buried in the ground
VOCAB: decompose | (of plants, food, bodies) slowly break down
VOCAB: greenhouse gas | a gas that traps heat in the atmosphere
VOCAB: disrupt an ecosystem | upset the natural balance of an area
VOCAB: lure | attract someone or an animal somewhere, often into danger
VOCAB: throwaway habits | using things briefly and then throwing them away
VOCAB: sustainable | able to continue without harming the environment

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if it says the opposite, and **Not stated** if the article doesn't say it.
1. According to the article, all Halloween pumpkins are bought to be eaten. = False | options: True ; False ; Not stated | hint: Paragraph 2: why were many of them bought?
2. In a landfill, pumpkins decompose without enough oxygen. = True | options: True ; False ; Not stated
3. The article presents composting as a perfect solution in every situation. = False | options: True ; False ; Not stated | hint: … is not the whole answer, either.
4. Painted pumpkins can make composting more difficult. = True | options: True ; False ; Not stated
5. Experts believe that leaving pumpkins in the woods is good for wildlife. = False | options: True ; False ; Not stated | hint: What do experts warn about?
6. Pumpkin seeds contain more nutrients than pumpkin flesh. = Not stated | options: True ; False ; Not stated

## 4 · Word formation
TYPE: gap
TEXT: Use the word in CAPITALS to form a word that fits the gap.
1. Pumpkin flesh breaks down slowly, and this ___ produces methane. (DECOMPOSE) = decomposition | hint: A noun: the process of breaking down.
2. Can big festivals ever be truly ___? (SUSTAIN) = sustainable | hint: An adjective ending in -able.
3. Pumpkins covered in wax and glitter are treated as ___ waste. (CONTAMINATE) = contaminated | hint: An adjective from a past participle.
4. Our ___ of fast fashion has doubled in twenty years. (CONSUME) = consumption | hint: A noun ending in -tion.
5. Buying food just to decorate the house seems rather ___ to me. (WASTE) = wasteful | hint: An adjective ending in -ful.
6. One pumpkin may seem ___, but millions of them are a real problem. (SIGNIFICANT) = insignificant | hint: The opposite meaning: add a prefix.
7. Experts warn that dumping pumpkins in the woods is ___. (RESPONSIBLE) = irresponsible | hint: The opposite meaning: add a prefix.

## 5 · Vocabulary in new contexts
TYPE: gap
TEXT: Complete the sentences with words from the article. The first letter is given. Change the form if necessary.
1. Cheap flights ___ (l…) thousands of tourists to the island every winter. = lure | hint: Attract, often into something risky.
2. The new motorway could seriously ___ (d…) the lives of birds in the area. = disrupt | hint: Upset the normal order.
3. Don't ___ (u…) how long the project will take: it's bigger than it looks. = underestimate | hint: Think something is smaller or easier than it really is.
4. There's no ___ (s…) to fluency: you simply have to practise every day. = shortcut | hint: A quicker, easier way.
5. After weeks without rain, the young trees were ___ (s…) of water. = starved | hint: Not getting enough of something they need.
6. Single-use coffee cups are a symbol of our ___ (t…) culture. = throwaway | hint: Used once and then thrown away.
7. Most of the town's rubbish ends up in a ___ (l…) ten kilometres away. = landfill | hint: A place where rubbish is buried.

## 6 · The passive, including reporting verbs
TYPE: gap
TEXT: Rewrite each sentence in the passive. Keep the meaning and the tense, and type only the missing verb form.
1. People throw away millions of pumpkins every year. → Millions of pumpkins ___ every year. = are thrown away | hint: Present simple passive.
2. The council hasn't set up a composting facility yet. → A composting facility ___ yet. = hasn't been set up ; has not been set up | hint: Present perfect passive.
3. You can turn leftover pumpkin into soup. → Leftover pumpkin ___ into soup. = can be turned | hint: Modal + be + past participle.
4. Someone had painted the pumpkins before the party. → The pumpkins ___ before the party. = had been painted | hint: Past perfect passive.
5. They will collect old pumpkins at the farm next Monday. → Old pumpkins ___ at the farm next Monday. = will be collected | hint: Future passive.
6. Scientists estimate that methane is around 80 times as powerful as CO₂ over twenty years. → Methane ___ around 80 times as powerful as CO₂ over twenty years. = is estimated to be | hint: Reporting passive: is + past participle + to + infinitive.
7. People believe that the tradition of carving lanterns started in Ireland. → The tradition of carving lanterns ___ in Ireland. = is believed to have started | hint: The belief is now, the action was in the past: to have + past participle.

## 7 · Let's discuss: your opinion
TYPE: open
TEXT: The article ends with a question: can a tradition be kept without the waste? Write **150–180 words**.
- Should people stop buying pumpkins just for decoration, or are traditions more important than a bit of waste?
- Give **at least two** arguments and suggest **one** realistic solution.
- Use **at least three** passive forms (one of them a reporting passive, e.g. *is said to*, *is believed to*) and **three** words from parts 4–5.
SUPPORT: On the one hand, … · On the other hand, … · It could be argued that … · Pumpkins are often bought / thrown away … · Halloween is said to … · Waste could be reduced if … · In my view, … · All things considered, …
PROMPT: Should people stop buying pumpkins just for decoration? (150–180 words)
