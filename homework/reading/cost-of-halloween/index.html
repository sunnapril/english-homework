STUDENT: ask
HOMEWORK: Reading · The Cost of Halloween
TITLE: The Cost of Halloween
TAG: Reading homework · B2 · about 35 minutes
INTRO: What happens to all those pumpkins after 31 October? Read the article, practise its vocabulary and the passive, then give your opinion. Please do everything on one device: your answers are saved only there.

## 1 · Before you read
TYPE: open
TEXT: Answer in **2–3 sentences**.
- What usually happens to decorations, flowers or leftover food in your home after a celebration?
SUPPORT: After a celebration, we usually … · Most of it ends up … · We try to … · To be honest, a lot of it gets thrown away.
PROMPT: What happens to decorations or leftover food in your home after a celebration?

## 2 · Read the article
TYPE: info
TEXT: **The Cost of Halloween**
TEXT: On 31 October, pumpkins are the stars of the show. They sit on doorsteps and windowsills, carved into grinning faces and lit with candles. A week later, the same pumpkins are soft, grey and forgotten, and many of them are simply thrown away.
TEXT: The numbers are not small. In 2025, about 1.5 billion pounds of pumpkins (almost 700,000 tonnes) were grown in the United States alone, and many of them were bought for decoration rather than for food. Once the party is over, a large number end up in the rubbish bin.
TEXT: The real problem begins at the landfill. There, pumpkins are buried under layers of other rubbish and broken down without enough oxygen. This process produces methane, a greenhouse gas that is far more powerful than carbon dioxide in the short term. One pumpkin may not seem important, but multiplied by millions of households, the waste is hard to ignore.
TEXT: The obvious answer is composting, but it isn't always that simple. Composting facilities haven't been built in every town, and pumpkins that have been painted, covered in glitter or filled with candle wax can't always be processed safely. Some people leave their old pumpkins in the forest "for the animals", but experts warn that this can disrupt local ecosystems and bring wild animals closer to roads and homes.
TEXT: An undecorated pumpkin, on the other hand, has plenty of second lives. It can be turned into soup or pie, its seeds can be roasted, and it can be given to a farm to feed animals.
TEXT: Perhaps the bigger question is not what we do with pumpkins on 1 November, but why we buy food just to look at it for a few days. Can a tradition be kept without the waste? And would anyone really notice the difference?

## 3 · True, false or not stated?
TYPE: choose
TEXT: Choose **True** if the article says this, **False** if the article says the opposite, and **Not stated** if the article doesn't say it.
1. According to the article, all Halloween pumpkins are bought to be eaten. = False | options: True ; False ; Not stated | hint: Paragraph 2: why were many of them bought?
2. In a landfill, pumpkins break down without enough oxygen. = True | options: True ; False ; Not stated
3. The article presents composting as a perfect solution in every situation. = False | options: True ; False ; Not stated | hint: … but it isn't always that simple.
4. Painted pumpkins can cause problems for composting. = True | options: True ; False ; Not stated
5. Experts say that leaving pumpkins in the forest helps wild animals survive the winter. = False | options: True ; False ; Not stated | hint: What do experts warn about?
6. Pumpkin seeds are more valuable than pumpkin flesh. = Not stated | options: True ; False ; Not stated

## 4 · Vocabulary in new contexts
TYPE: gap
TEXT: Complete each sentence with one word or phrase from the bank. Use every item once.
BANK: landfill; greenhouse gas; compost; disrupt; households; facilities; throwaway
1. Most of the city's rubbish still ends up in a ___ outside town. = landfill | hint: A place where rubbish is buried.
2. Methane is a ___ that traps heat in the atmosphere. = greenhouse gas
3. We ___ our vegetable peelings and use them in the garden. = compost | hint: Let organic waste break down naturally.
4. Loud tourist boats can ___ the lives of birds on the lake. = disrupt | hint: Interrupt or upset the normal order.
5. The survey was sent to 2,000 ___ across the region. = households | hint: Groups of people living in one home.
6. The town has no recycling ___, so all plastic is buried or burnt. = facilities | hint: Buildings or equipment for a particular purpose.
7. Cheap fashion has created a ___ culture: we wear clothes a few times and then buy new ones. = throwaway | hint: Made to be used once or briefly.

## 5 · The passive
TYPE: gap
TEXT: The article uses many passive forms (*were grown, are buried, haven't been built, can be turned*). Rewrite each sentence in the passive. Keep the same tense and type only the missing verb form.
1. People throw away millions of pumpkins after Halloween. → Millions of pumpkins ___ after Halloween. = are thrown away | hint: Present simple passive: am / is / are + past participle.
2. The city hasn't built a composting facility yet. → A composting facility ___ yet. = hasn't been built ; has not been built | hint: Present perfect passive: has / have + been + past participle.
3. You can turn an old pumpkin into soup. → An old pumpkin ___ into soup. = can be turned | hint: Modal + be + past participle.
4. Workers buried the rubbish under a layer of soil. → The rubbish ___ under a layer of soil. = was buried | hint: Past simple passive.
5. Someone had painted the pumpkins before the party. → The pumpkins ___ before the party. = had been painted | hint: Past perfect passive.
6. Volunteers are collecting old pumpkins at the farm this week. → Old pumpkins ___ at the farm this week. = are being collected | hint: Present continuous passive: am / is / are + being + past participle.

## 6 · Your opinion
TYPE: open
TEXT: The article ends with a question: can a tradition be kept without the waste? Write **120–150 words**.
- Should people stop buying pumpkins just for decoration, or are traditions more important than a bit of waste?
- Give **at least two** arguments and suggest **one** realistic solution.
- Use **at least three** passive forms and **two** words from part 4.
SUPPORT: On the one hand, … · On the other hand, … · It could be argued that … · Pumpkins are often bought / thrown away … · Waste could be reduced if … · In my view, … · All things considered, …
PROMPT: Should people stop buying pumpkins just for decoration? (120–150 words)
