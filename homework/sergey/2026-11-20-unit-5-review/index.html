STUDENT: Sergey

TITLE: Unit 5 review: crime, money and precise words

INTRO: Review the language of Unit 5 in new situations: crime, quantifiers, money, adverb + adjective, phrases with *leave* — and finish with a short story of your own.

## 1. A heist gone wrong
TYPE: gap
TEXT: Complete the story with the phrases from the bank. There are **two extra** phrases.
BANK: broke into; evade arrest; left the scene of the crime; charged; pleaded; went on trial; found; sentenced; planned; caught
1. Late one night, two men ___ a video game shop and took forty new consoles. = broke into | hint: entered a building illegally, by force
2. They hoped to ___ by changing into delivery uniforms. = evade arrest | hint: avoid being caught by the police
3. But one of them dropped his phone as they ___. = left the scene of the crime | hint: went away from the place where it happened
4. The next day the police ___ both men with burglary. = charged | hint: formally accused
5. At first, both men ___ not guilty. = pleaded ; pled | hint: what they said in court about themselves
6. They ___ in March. = went on trial | hint: their case was heard in court
7. The jury ___ them guilty of all charges. = found | hint: the jury's decision
8. They were ___ to two years in prison. = sentenced | hint: the judge's punishment

## 2. Quantifiers
TYPE: choose
TEXT: Choose the correct option.
1. Each of my teammates ___ a different role in the raid. = has | options: has ; have | hint: each of + plural noun + singular verb
2. Every ___ in the chat voted for the new map. = player | options: player ; players | hint: every + singular noun
3. We don't have ___ time before the server restarts. = much | options: much ; many | hint: time is uncountable here
4. ___ of the two patches fixed the bug — it's still there. = Neither | options: Neither ; None ; Both | hint: not one of two
5. I've played this level a couple of ___ already. = times | options: time ; times | hint: a couple = two
6. Can either of you ___ me your charger? = lend | options: lend ; lends | hint: Can + infinitive
7. ___ of the six beta testers liked the new menu, so we removed it. = None | options: None ; Neither ; No | hint: not one of more than two
8. There were ___ people at the launch — the hall was packed. = loads of | options: loads of ; few ; a little | hint: packed = full

## 3. Money words
TYPE: gap
TEXT: Complete the sentences with words from the bank. There are **two extra** words.
BANK: interest; recession; inflation; pension; donation; budget; bargain; savings; income; investment
1. My bank pays only 1% ___ on this account. = interest | hint: what the bank pays you for keeping money there
2. During the ___, many studios closed and thousands of developers lost their jobs. = recession | hint: a bad period for the whole economy
3. Because of ___, the same weekly shopping costs much more than a year ago. = inflation | hint: prices keep going up
4. After forty years of work, my grandfather now lives on his state ___. = pension | hint: money you get after you retire
5. Every month she makes a small ___ to an animal shelter. = donation | hint: money you give to help an organisation
6. We have a ___ of €800 for the new PC, so the top graphics card is out of the question. = budget | hint: the money you plan to spend
7. This monitor was half price on Black Friday — a real ___. = bargain | hint: cheaper than usual
8. He spent all his ___ on a trip to Japan, and now there's nothing left in his account. = savings | hint: money you kept in the bank

## 4. Adverb + adjective
TYPE: choose
TEXT: Choose the adverb that goes naturally with the adjective.
1. The new version is ___ different from the beta — even the map has changed. = completely | options: completely ; highly ; deeply ; widely | hint: 100% different
2. The game is now ___ available in all regions. = widely | options: widely ; deeply ; bitterly ; perfectly | hint: in many places
3. It's ___ cold outside — take a hat. = bitterly | options: bitterly ; highly ; widely ; deeply | hint: a very cold wind
4. Don't worry, the file is ___ safe — I've scanned it. = perfectly | options: perfectly ; bitterly ; highly ; widely | hint: completely
5. Fixing this bug is ___ simple — it'll take ten minutes. = relatively | options: relatively ; bitterly ; deeply ; widely | hint: compared with other bugs
6. It's ___ unlikely that they'll release the sequel this year. = highly | options: highly ; perfectly ; bitterly ; widely | hint: very
7. I was ___ disappointed when the studio cancelled the game. = bitterly | options: bitterly ; perfectly ; entirely ; widely | hint: a strong, painful feeling
8. €90 for a remaster? That's ___ ridiculous! = absolutely | options: absolutely ; relatively ; deeply ; widely | hint: goes with strong adjectives

## 5. Phrases with leave
TYPE: gap
TEXT: Complete each sentence with **one word**. The first letter is given in brackets.
1. I put my hot mug on the new desk, and it's left a ___ (m…). = mark | hint: a small dirty spot
2. For goodness' sake, leave me ___ (a…) — I'm in a ranked match! = alone | hint: don't disturb me
3. I need to go back home. I think I've left the iron ___ (o…). = on | hint: not switched off
4. Why do you always leave the kitchen in such a ___ (m…)? = mess | hint: untidy
5. The repair shop left a ___ (m…) on my phone: the laptop is ready. = message | hint: voicemail
6. My hands are freezing. I stupidly left my gloves at ___ (h…). = home | hint: where you live
7. No wonder you can't find your headphones — you always leave them lying ___ (a…). = around | hint: not put away
8. Need someone to organise the team dinner? Leave it to ___ (m…)! = me | hint: I'll do it

## 6. A frightening moment
TYPE: open
TEXT: Write **70–90 words**. Describe a moment in a game or film that really frightened you. What happened, and why did it work — or why didn't it?
TEXT: Use **one** stronger word than *scary*, and **one** phrase from part 4.
SUPPORT: frightening · hair-raising · blood-curdling · a jump scare · it started moving towards me · What made it frightening was … · Unlike a jump scare, … · absolutely terrifying · completely unexpected
PROMPT: A frightening moment in a game or film (70–90 words)
