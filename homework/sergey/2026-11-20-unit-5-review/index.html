STUDENT: Sergey

INTRO: Review the language of Unit 5 in new situations: crime, quantifiers, money and adverb + adjective collocations — and finish with a short story of your own.

## 1. A heist gone wrong
TYPE: gap
TEXT: Complete the story with the phrases from the bank. There are **two extra** phrases.
BANK: broke into; evade arrest; left the scene of the crime; charged; pleaded; went on trial; found; sentenced; planned; caught
1. Late one night, two men ___ a video game shop and took forty new consoles. = broke into | hint: entered a building illegally, by force
2. They hoped to ___ by changing into delivery uniforms. = evade arrest | hint: avoid being caught by the police
3. But one of them dropped his phone as they ___. = left the scene of the crime | hint: went away from the place where it happened
4. The next day the police ___ both men with burglary. = charged | hint: formally accused
5. At first, both men ___ not guilty. = pleaded ; pled | hint: what they said in court about themselves
6. They ___ in March. = went on trial | hint: their case was heard in court
7. The jury ___ them guilty of all charges. = found | hint: the jury's decision
8. They were ___ to two years in prison. = sentenced | hint: the judge's punishment

## 2. Quantifiers
TYPE: choose
TEXT: Choose the correct option.
1. Each of my teammates ___ a different role in the raid. = has | options: have ; has | hint: each of + plural noun + singular verb
2. Every ___ in the chat voted for the new map. = player | options: player ; players | hint: every + singular noun
3. We don't have ___ time before the server restarts. = much | options: many ; much | hint: time is uncountable here
4. ___ of the two patches fixed the bug — it's still there. = Neither | options: None ; Both ; Neither | hint: not one of two
5. I've played this level a couple of ___ already. = times | options: times ; time | hint: a couple = two
6. Can either of you ___ me your charger? = lend | options: lend ; lends | hint: Can + infinitive
7. ___ of the six beta testers liked the new menu, so we removed it. = None | options: No ; Neither ; None | hint: not one of more than two
8. There were ___ people at the launch — the hall was packed. = loads of | options: few ; loads of ; a little | hint: packed = full

## 3. Money words
TYPE: gap
TEXT: Complete the sentences with words from the bank. There are **two extra** words.
BANK: interest; recession; inflation; pension; donation; budget; bargain; savings; income; investment
1. My bank pays only 1% ___ on this account. = interest | hint: what the bank pays you for keeping money there
2. During the ___, many studios closed and thousands of developers lost their jobs. = recession | hint: a bad period for the whole economy
3. Because of ___, the same weekly shopping costs much more than a year ago. = inflation | hint: prices keep going up
4. After forty years of work, my grandfather now lives on his state ___. = pension | hint: money you get after you retire
5. Every month she makes a small ___ to an animal shelter. = donation | hint: money you give to help an organisation
6. We have a ___ of €800 for the new PC, so the top graphics card is out of the question. = budget | hint: the money you plan to spend
7. This monitor was half price on Black Friday — a real ___. = bargain | hint: cheaper than usual
8. He spent all his ___ on a trip to Japan, and now there's nothing left in his account. = savings | hint: money you kept in the bank

## 4. Adverb + adjective in context
TYPE: choose
TEXT: Choose the adverb that goes naturally with the adjective. Try to remember the whole collocation, not just the adverb.
1. The new version is ___ different from the beta — even the map has changed. = completely | options: highly ; deeply ; completely ; widely | hint: 100% different
2. The game is now ___ available in all regions. = widely | options: deeply ; widely ; bitterly ; perfectly | hint: in many places
3. It's ___ cold outside — take a hat. = bitterly | options: highly ; widely ; deeply ; bitterly | hint: a very cold wind
4. Don't worry, the file is ___ safe — I've scanned it. = perfectly | options: perfectly ; bitterly ; highly ; widely | hint: completely
5. Fixing this bug is ___ simple — it'll take ten minutes. = relatively | options: bitterly ; deeply ; relatively ; widely | hint: compared with other bugs
6. It's ___ unlikely that they'll release the sequel this year. = highly | options: perfectly ; highly ; bitterly ; widely | hint: very
7. I was ___ disappointed when the studio cancelled the game. = bitterly | options: perfectly ; entirely ; widely ; bitterly | hint: a strong, painful feeling
8. €90 for a remaster? That's ___ ridiculous! = absolutely | options: absolutely ; relatively ; deeply ; widely | hint: goes with strong adjectives

## 5. Adverb + adjective from memory
TYPE: gap
TEXT: Write the adverb. The first letter is given. These are **new** adjectives — think which adverb they usually go with.
1. We need a ___ (h…) qualified engineer for this project. = highly | hint: very, about skills and qualifications
2. I was ___ (d…) moved by the documentary about the volunteers. = deeply | hint: about strong feelings
3. Don't worry — it's ___ (p…) normal for a new phone to get warm while it updates. = perfectly | hint: completely
4. This myth is ___ (w…) believed, but there's no evidence for it. = widely | hint: by many people
5. Second-hand consoles are ___ (r…) cheap compared with new ones. = relatively | hint: compared with something else
6. A good backup is ___ (a…) essential if you work with important files. = absolutely | hint: essential is already a strong adjective
7. Local residents are ___ (b…) opposed to the new airport. = bitterly | hint: strongly and angrily
8. The remake is an ___ (e…) new game, not just better graphics. = entirely | hint: completely

## 6. Breaking news
TYPE: open
TEXT: Write a short **news story** (70–90 words) about an unusual crime — real or invented. It can happen in a game world, too.
TEXT: Use **three** crime phrases from part 1, **two** quantifiers and **one** adverb + adjective collocation.
SUPPORT: Police are looking for … · The gang broke into … · Neither of the suspects … · None of the staff … · Several witnesses … · They managed to evade arrest by … · was charged with … · is due to go on trial … · in a highly unusual case · completely unexpected
