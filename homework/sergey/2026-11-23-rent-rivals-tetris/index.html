## 2 · Listening · Rivalry
TYPE: order
TEXT: Listen to a radio programme about rivalry. Put the kinds of rivalry in the order the speaker mentions them.
AUDIO: 13_ROADMAP_B2_Tests_MidT_R2.mp3
SCRIPT: Presenter: On The World About this afternoon, we welcome Professor Lynda Chandle, who’s going to discuss with us today’s topic: rivalry. Welcome, Professor Chandle.
SCRIPT: Lynda: Hello, and please call me Lynda. After all, there’s no rivalry between us!
SCRIPT: Presenter: That’s true, at least I hope that’s the case! Er … Lynda. So, anyway, rivalry. What is it, exactly?
SCRIPT: Lynda: Well to put it simply, rivalry is when a person or a group of people try to be better than another person or group of people. Usually this feeling is very strong. So, perhaps the most obvious examples of rivalry are in sport.
SCRIPT: Presenter: Lots of rivals there …
SCRIPT: Lynda: Yes. For example, at the moment there’s a lot of intense rivalry in tennis, between individual players. But rivalry can also be extremely strong between teams, particularly international teams. So, in ice hockey the biggest rivals are Russia and Canada, in judo it’s South Korea and Japan, and in football there’s … well, because it is such an international sport, between many teams.
SCRIPT: Presenter: Yes, undoubtedly. But aren’t these teams rivals because they’re neighbours?
SCRIPT: Lynda: Well, that’s often true, but not always. Australia and England are about as far apart geographically as you can get, but they are intense rivals in cricket.
SCRIPT: Presenter: Point taken. But rivalry doesn’t only happen in sport, does it?
SCRIPT: Lynda: Oh no. It’s in all parts of our lives. Many people will know of – and perhaps have experienced – sibling rivalry, when brothers and sisters are particularly competitive – often over a parent’s attention. At school too, there’s often rivalry between students. And, in fact, this is something that is encouraged in education, as a way to keep children focused on getting good exam results.
SCRIPT: Presenter: But can’t this have a negative impact, too?
SCRIPT: Lynda: Yes, absolutely. Students that don’t ‘beat’ their rivals, who don’t get good grades, sometimes just give up instead of working harder. So it can have the opposite effect to what teachers want.
SCRIPT: Presenter: I see …
SCRIPT: Lynda: In fact, rivalry in education goes beyond the classroom. It can be between schools. For example, my own secondary school was, what I guess you might say, of average academic ability. Most students didn’t go to university, but were encouraged to become carpenters, plumbers, hairdressers, etc. Which are very important roles in our society.
SCRIPT: Presenter: Yes, of course.
SCRIPT: Lynda: So, that was my school, but just up the road was another secondary school which had a much better academic reputation. Their students were expected to go to university. They weren’t necessarily cleverer – even if they thought they were …
SCRIPT: Presenter: Ah … I sense some rivalry from you there!
SCRIPT: Lynda: Ha! Yes, maybe you’re right … even after all these years.
SCRIPT: Presenter: So, briefly, can you tell us about some other types of rivalry?
SCRIPT: Lynda: Well, another common one is between colleagues at work. In some ways it’s similar to sibling rivalry, but instead of trying to get a parent’s attention, the rivals are trying to get the boss’ attention, maybe hoping for a pay rise or promotion.
SCRIPT: Presenter: Are you listening, bosses?
SCRIPT: Lynda: I must stress, though, not everyone behaves like this. Far from it. Not everyone is a rival in every, or perhaps any, area of their life.
SCRIPT: Presenter: I see …
SCRIPT: Lynda: I’ve mentioned workplace rivalry. I should also mention the strong rivalry between companies.
SCRIPT: Presenter: Yes, we’ve seen this in technology companies recently.
SCRIPT: Lynda: Good example. Sometimes the rivalry is so strong between companies that they even turn to crime.
SCRIPT: Presenter: Really?
SCRIPT: Lynda: Absolutely. Of course, companies often try to find out what their rivals are planning to do next, but sometimes they take this a step too far and try to get information illegally.
SCRIPT: Presenter: Fascinating! Well, I wish we could discuss this further, but I’m afraid we’ll have to leave it there …
1. workplace rivalry = 5
2. student rivalry = 3
3. rivalry between companies = 6
4. sibling rivalry = 2
5. rivalry between schools = 4
6. rivalry in sport = 1

## 7 · Reading · The tricks stores use to get us to spend more money
TYPE: article
TEXT: **1** We've all gone into a shop and spent far more than we wanted. We have three things on our list but come out with ten. We shouldn't feel too guilty about this though, as shop owners employ various psychological tricks to make us part with our hard-earned cash. Remember – you're not the only one falling for these tricks.
TEXT: **2** Take *buy one get one free* deals. We think we're getting 100 percent free but what the store is actually offering us is a 50 percent discount on two products. That's the same thing, you might say, but really, it's not. You wanted one item but the offer forced you to buy two, meaning you spent twice as much and nothing was free at all. There's also the issue of exactly what price is discounted. Stores have been known to push up the price of the item on sale so that your discount is reduced.
TEXT: **3** Another trick is to offer what seems to be good deals when you bulk-buy. For example, €2.77 for a pack of seven chocolate bars seems better than €1.50 for a pack of four. However, it's the price per item that's important here. It's more economical to get the smaller bundle at 38 cents as opposed to 40 cents per bar. On other occasions, the cost per bar may be the same whether you buy a four-pack or a nine-pack. Either way, if you buy the multi-pack, you've spent more than you needed to. Of course, how many of us are going to calculate and compare prices in this way? Stores know that we have better things to do with our time.
TEXT: **4** Weight is another factor. Shoppers don't necessarily pay close attention to how much of a product they receive for what price. That means they might not make the best decision about which item to buy, choosing an item 'on sale' at €2.00 because it seems cheaper than a similar product for sale at €2.50. However, the €2.50 product might be in a bigger box which means you actually get more for your money. On top of that, some manufacturers have been known to give the weight of one size of a product in grams and another in kilograms so that it's difficult for customers to compare. The bigger packet may seem like a more economical option, but in fact two smaller packets work out cheaper.
TEXT: **5** All in all, it's our inability to remember prices of items that stores rely on. Because of this, we're unable to truly recognise what is a real bargain and what is a trick. Prices may be labelled as *The lowest ever price* but often it hasn't changed for weeks, so we're not actually going to pay any less. There's been research which suggests the price is occasionally higher than it was in the past, too.
TEXT: **6** So, what does this mean for the shopper? It means that we need to pay more attention to the price of products we regularly buy and how much we get for that money. That way, we're better able to evaluate a deal. We can do a quick calculation to see whether an offer is in fact a bargain or simply a trick to get us to spend more.
