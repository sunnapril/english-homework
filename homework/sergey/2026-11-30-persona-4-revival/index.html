## 1 · Read · 10 min
TYPE: choose
TEXT: Read the news story and answer the questions. Open “New vocabulary” first if you need it.
TEXT: **Persona 4 is coming back**
TEXT: Atlus has confirmed that Persona 4 Revival, a full remake of its 2008 role-playing game, will come out on 18 February 2027 on PlayStation 5, Xbox Series X|S and PC. Game Pass subscribers will be able to play it from day one, and a Nintendo Switch 2 version will follow three months later, on 20 May.
TEXT: Fans had to wait a whole year for a date. The remake was first announced at the Xbox Games Showcase in June 2025, but all they got then was a 45-second teaser. In June 2026, at the same event, Atlus finally showed a proper trailer and opened pre-orders. At the same show, the studio also announced Persona 6, the next main game in the series.
TEXT: Revival is not just a remaster with sharper textures. It is being rebuilt from scratch in Unreal Engine 5, and it is based on Persona 4 Golden, the expanded version from 2012, not only on the original. The team promises new visuals, updated combat, easier dungeon navigation and more Social Links, the relationships you build with other characters. The goal is to make the game feel like the studio's recent hits, Persona 3 Reload and Persona 5 Royal.
TEXT: Two changes have already divided fans. All the anime cutscenes are being made by the well-known studio MAPPA, which most players see as good news. But while the Japanese voice cast stays the same, the English cast has been completely replaced, and some fans are not happy about losing the voices they grew up with.
VOCAB: **remake** | a new version of an old game, built again from the beginning | ремейк
VOCAB: **from scratch** | from the very beginning, without using old work | с нуля
VOCAB: **teaser** | a very short trailer that shows almost nothing | тизер
VOCAB: **pre-order** | to order a game before it comes out | предзаказ, сделать предзаказ
VOCAB: **from day one** | from the first day of release | с первого дня
VOCAB: **divide fans** | to make fans disagree with each other | разделить фанатов

3. Which version of the game is the remake based on? = Persona 4 Golden from 2012 | options: Persona 4 Golden from 2012 ; only the 2008 original ; Persona 3 Reload | hint: the expanded version
4. Why is Revival “not just a remaster”? = It is rebuilt from scratch in a new engine. | options: It has a completely new story. ; It is rebuilt from scratch in a new engine. ; It costs more than a remaster. | hint: Unreal Engine 5

## 2 · Remake, remaster or port? · 7 min
TYPE: gap
TEXT: Gamers have different words for “a new version of an old game”: a **remake** is built again from scratch; a **remaster** is the same game with better graphics and sound; a **port** is the same game moved to another console; an **enhanced edition** adds new content to the same game; a **reboot** starts a series again with a new story. Complete the sentences. **One word is extra.**
BANK: remake; remaster; port; enhanced edition; reboot; sequel
1. The studio rebuilt the whole game in a new engine with new combat. It's a full ___. = remake | hint: built again from scratch
2. Same game, same engine, but now in 4K with sharper textures: it's a ___. = remaster | hint: better graphics and sound
3. The PS4 game now also runs on Switch 2, but nothing else has changed. It's just a ___. = port | hint: moved to another console
4. Persona 5 Royal is the ___ of Persona 5: a new character, a new semester and new story events. = enhanced edition | hint: new content added to the same game
5. The series starts again with new characters and a new story, as if the old games never happened. It's a ___. = reboot | hint: starts the series again

## 3 · A, the or nothing? · 8 min
TYPE: choose
TEXT: Remember: we use **a/an** when we **describe** something (we say what kind of thing it is), **the** when we **point at** the only one or the one we know, and **no article** for plural or uncountable nouns in general.
1. Revival is ___ remake, not just a remaster. = a | options: the ; a ; — | hint: describing what kind of game it is
2. For many fans, it's ___ remake they have been waiting for since 2025. = the | options: a ; — ; the | hint: pointing at one: the remake they have been waiting for
3. Persona 4 Golden was ___ expanded version of the 2008 game. = an | options: an ; the ; — | hint: describing; expanded starts with a vowel sound
4. MAPPA is ___ studio that made the opening movie for Persona 5 Royal. = the | options: — ; the ; a | hint: there is only one studio that made it
5. MAPPA is ___ Japanese animation studio. = a | options: the ; — ; a | hint: describing what kind of studio
6. ___ fans don't like it when familiar voices change. = — | options: — ; The ; A | hint: plural, in general
7. Some fans miss ___ voices they grew up with. = the | options: a ; the ; — | hint: which voices? the ones they grew up with
8. Persona 6 will be ___ next main game in the series. = the | options: the ; a ; — | hint: there is only one next game
