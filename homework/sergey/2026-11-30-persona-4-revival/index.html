## 1 · Read · 10 min
TYPE: choose
TEXT: Read the news story and answer the questions. Open “New vocabulary” first if you need it.
TEXT: **Persona 4 is coming back**
TEXT: Atlus has confirmed that Persona 4 Revival, a full remake of its 2008 role-playing game, will come out on 18 February 2027 on PlayStation 5, Xbox Series X|S and PC. Game Pass subscribers will be able to play it from day one, and a Nintendo Switch 2 version will follow three months later, on 20 May.
TEXT: Fans had to wait a whole year for a date. The remake was first announced at the Xbox Games Showcase in June 2025, but all they got then was a 45-second teaser. In June 2026, at the same event, Atlus finally showed a proper trailer and opened pre-orders. At the same show, the studio also announced Persona 6, the next main game in the series.
TEXT: Revival is not just a remaster with sharper textures. It is being rebuilt from scratch in Unreal Engine 5, and it is based on Persona 4 Golden, the expanded version from 2012, not only on the original. The team promises new visuals, updated combat, easier dungeon navigation and more Social Links, the relationships you build with other characters. The goal is to make the game feel like the studio's recent hits, Persona 3 Reload and Persona 5 Royal.
TEXT: Two changes have already divided fans. All the anime cutscenes are being made by the well-known studio MAPPA, which most players see as good news. But while the Japanese voice cast stays the same, the English cast has been completely replaced, and some fans are not happy about losing the voices they grew up with.
VOCAB: **remake** | a new version of an old game, built again from the beginning | ремейк
VOCAB: **from scratch** | from the very beginning, without using old work | с нуля
VOCAB: **teaser** | a very short trailer that shows almost nothing | тизер
VOCAB: **pre-order** | to order a game before it comes out | предзаказ, сделать предзаказ
VOCAB: **from day one** | from the first day of release | с первого дня
VOCAB: **divide fans** | to make fans disagree with each other | разделить фанатов
1. When does the game come out on PC? = on 18 February 2027 | options: on 20 May 2027 ; on 18 February 2027 ; in June 2026 | hint: The Switch 2 version comes later.
2. What did fans get in June 2025? = only a short teaser | options: a release date and pre-orders ; a playable demo ; only a short teaser | hint: 45 seconds
3. Which version of the game is the remake based on? = Persona 4 Golden from 2012 | options: Persona 4 Golden from 2012 ; only the 2008 original ; Persona 3 Reload | hint: the expanded version
4. Why is Revival “not just a remaster”? = It is rebuilt from scratch in a new engine. | options: It has a completely new story. ; It is rebuilt from scratch in a new engine. ; It costs more than a remaster. | hint: Unreal Engine 5
5. What are Social Links? = the relationships you build with other characters | options: online multiplayer modes ; links to the anime series ; the relationships you build with other characters | hint: look at the end of paragraph 3
6. Which change are some fans unhappy about? = the new English voice cast | options: the new English voice cast ; the anime cutscenes by MAPPA ; the Japanese voice cast | hint: the voices they grew up with

## 2 · Same game or a new one? · 8 min
TYPE: choose
TEXT: Remake, remaster, port + the language of **comparison and contrast** (from Test Your Vocabulary for FCE, test 3). Choose the best word or expression.
1. Persona 4 Revival is a ___, not a remaster: the whole game was rebuilt in a new engine. = remake | options: remake ; port ; reboot | hint: built again from scratch
2. The remake and the original have a lot ___: the same story, the same town and the same characters. = in common | options: in common ; in similar ; in particular | hint: have a lot … = share many things
3. On an old TV, even fans find it hard to ___ between a remaster and the original. = distinguish | options: distinct ; differ ; distinguish | hint: verb + between = see the difference
4. The two versions mainly ___ in graphics, combat and voice acting. = differ | options: different ; differ ; difference | hint: you need a verb
5. A ___ is the same game moved to a new console, with no other changes. = port | options: sequel ; reboot ; port | hint: same game, new platform
6. The original had slow menus, ___ the remake promises easier dungeon navigation. = whereas | options: whereas ; therefore ; despite | hint: links two contrasting facts in one sentence
7. Visually, the 2008 game and the 2027 remake are ___. = worlds apart | options: years away ; miles away ; worlds apart | hint: completely different
8. Most remakes keep the original story. ___, Final Fantasy VII Remake changed parts of it. = By way of contrast | options: By similar means ; In the same way ; By way of contrast | hint: the second sentence says the opposite

## 3 · A, the or nothing? · 8 min
TYPE: choose
TEXT: Remember: we use **a/an** when we **describe** something (we say what kind of thing it is), **the** when we **point at** the only one or the one we know, and **no article** for plural or uncountable nouns in general.
1. Revival is ___ remake, not just a remaster. = a | options: the ; a ; — | hint: describing what kind of game it is
2. For many fans, it's ___ remake they have been waiting for since 2025. = the | options: a ; — ; the | hint: pointing at one: the remake they have been waiting for
3. Persona 4 Golden was ___ expanded version of the 2008 game. = an | options: an ; the ; — | hint: describing; expanded starts with a vowel sound
4. MAPPA is ___ studio that made the opening movie for Persona 5 Royal. = the | options: — ; the ; a | hint: there is only one studio that made it
5. MAPPA is ___ Japanese animation studio. = a | options: the ; — ; a | hint: describing what kind of studio
6. ___ fans don't like it when familiar voices change. = — | options: — ; The ; A | hint: plural, in general
7. Some fans miss ___ voices they grew up with. = the | options: a ; the ; — | hint: which voices? the ones they grew up with
8. Persona 6 will be ___ next main game in the series. = the | options: the ; a ; — | hint: there is only one next game

## 4 · Say it another way · 12 min
TYPE: gap
TEXT: Exam task (FCE, Use of English). Complete the second sentence so that it means the same as the first. Use the word in **bold** and do not change it. Use **2–5 words**, including the word in bold.
1. The only level I didn't finish was level seven. **except** → I finished ___ level seven. = all the levels except ; every level except ; all levels except | hint: everything apart from one level
2. Don't buy the game if you don't feel like playing it. **point** → There's ___ the game if you don't feel like playing it. = no point in buying ; no point buying | hint: there's no point + -ing
3. They continued to play despite the terrible lag. **though** → They continued to play, even ___. = though the lag was terrible ; though there was terrible lag | hint: even though + subject + verb
4. How likely is Remedy's new game to win Game of the Year? **chances** → What are ___ Game of the Year? = the chances of it winning ; its chances of winning | hint: chances of + -ing
5. I don't really want you to post spoilers in the chat. **rather** → I ___ post spoilers in the chat. = would rather you didn't ; 'd rather you didn't ; would rather you did not | hint: would rather + you + past tense
6. The studio hasn't said anything about the sequel for over a year. **heard** → We ___ the sequel over a year ago. = last heard about ; last heard anything about | hint: the last time we … was a year ago
7. I regret not pre-ordering the collector's edition. **wish** → I ___ the collector's edition. = wish I had pre-ordered ; wish I'd pre-ordered ; wish I had preordered ; wish I'd preordered | hint: regret about the past: wish + past perfect
8. He found it really hard to beat the final boss. **difficulty** → He ___ the final boss. = had difficulty beating ; had difficulty in beating ; had great difficulty beating ; had great difficulty in beating ; had a lot of difficulty beating | hint: have difficulty (in) + -ing
