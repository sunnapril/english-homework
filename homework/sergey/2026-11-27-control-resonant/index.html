## 3 · Phrases from the video in new situations · 10 min
TYPE: gap
TEXT: These phrases are from the video. Complete the new sentences. **One phrase is extra.**
BANK: stand on its own feet; up close and personal; resonated with; incentivizes; nail down; a fish out of water; dear to; leap into

## 4 · As high a price as possible · 8 min
TYPE: gap
TEXT: You asked about this structure: **as + adjective + a/an + noun + as possible**, for example *sell it for **as high a price as possible***. Use the normal adjective, not the comparative (not *as higher*). The same idea in another form: **the highest possible price**. Complete the sentences with the words in brackets.
1. Henk wanted to sell the rights for ___ (high / price). = as high a price as possible | hint: as + adjective + a + noun + as possible
2. Before the launch, the studio needed ___ (accurate / estimate) of the costs. = as accurate an estimate as possible | hint: accurate starts with a vowel sound: a or an?
3. The players lost their saves, so the team had to fix the bug in ___ (short / time). = as short a time as possible | hint: as + short + a + time + as possible
4. The agent tried to get ___ (good / deal) from the Soviet officials. = as good a deal as possible | hint: good, not better
5. For the trailer, the editors chose ___ (dramatic / moment) from the game. = as dramatic a moment as possible | hint: as + adjective + a + noun + as possible
6. Same meaning as *as large an audience as possible*: the marketing team wanted to reach the ___ audience. = largest possible | hint: the + superlative + possible
7. Same meaning as *as low a price as possible*: fans hoped for the ___ price on release day. = lowest possible | hint: the + superlative + possible
