STUDENT: Sergey
HOMEWORK: Roadmap B2 · Unit 5B · Crime scene: quantities and evidence · due 06.11.2026
TITLE: The evidence matters
TAG: Roadmap B2 · Unit 5B · due 6 November 2026 · about 30 minutes
INTRO: Practise precise quantities, crime vocabulary and natural English by examining a fictional investigation and correcting common mistakes.

## 1. Bring it back
TYPE: gap
TEXT: Complete the sentences with expressions from previous lessons. There are **two extra** expressions.
BANK: coherent; in instalments; charged with; back down; unspoken rule; splash out on; curfew; rumour
1. The designer's explanation was clear and ___: every decision followed logically from the previous one. = coherent | hint: clear and logically connected
2. Rather than paying the full price immediately, we agreed to pay ___ over six months. = in instalments | hint: several smaller payments
3. The accountant was formally ___ fraud after investigators examined the company records. = charged with | hint: formally accused of a crime
4. Even when everyone criticised his proposal, he refused to ___ and continued defending it. = back down | hint: stop defending your position
5. Nobody had written it down, but there was an ___ that employees never shared clients' passwords. = unspoken rule | hint: an informal expectation
6. They decided to ___ a premium monitor after receiving an unexpected bonus. = splash out on | hint: spend a lot on something special

## 2. Crime scene vocabulary
TYPE: gap
TEXT: Complete the investigation notes. There are **two extra** words.
BANK: suspect; evidence; witness; deception; convicted; trial; omitted; exaggerated
1. A security guard who actually saw the break-in became an important ___ in the investigation. = witness
2. The police identified a possible ___ after comparing the fingerprints with their records. = suspect
3. The lawyer argued that the video was unreliable ___ because the recording had been edited. = evidence
4. The company's fake invoices were part of a deliberate ___ designed to hide missing money. = deception
5. After the jury found him guilty, the former manager was ___ of fraud. = convicted
6. The case went to ___ after the defendant refused to admit responsibility. = trial

## 3. Choose the precise quantity
TYPE: choose
TEXT: Choose the most natural quantifier. Pay attention to countability, the size of the group and whether the amount is sufficient.
1. The investigators had ___ information, so they couldn't identify the owner of the vehicle. = little | options: little ; a little ; a few
2. The police found ___ useful fingerprints, which allowed them to identify a new suspect. = a few | options: few ; a few ; a little
3. ___ of the two security guards was on duty when the alarm went off. Both were at home. = Neither | options: Neither ; None ; Either
4. ___ of the seven witnesses could remember the registration number. Not one of them had seen it clearly. = None | options: Neither ; None ; Both
5. The officer interviewed ___ witness separately, rather than questioning them together. = each | options: each ; all ; both
6. The laboratory examined ___ the samples collected at the scene. Nothing was left untested. = all | options: every ; all ; each
7. We have ___ time before the hearing starts, so we can review one more document. = a little | options: little ; a little ; a few
8. There were ___ complaints about the new security system, so management decided to investigate the problem. = several | options: much ; several ; a little
9. ___ suspect was carrying an identification card, so the police had to verify both names. = Neither | options: Neither ; None ; Every
10. The team doesn't have ___ evidence to justify an arrest, so they must continue investigating. = enough | options: enough ; many ; several ; a few

## 4. Repair the investigation report
TYPE: gap
TEXT: Rewrite the incorrect expression in each sentence. Type only the corrected words, not the whole sentence.
1. None of the witnesses didn't recognise the driver. → None of the witnesses ___ the driver. = recognised ; recognized | hint: None already makes the statement negative.
2. The police didn't find many evidence at the scene. → The police didn't find ___ at the scene. = much evidence ; any evidence | hint: Evidence is uncountable.
3. Every of the officers received a copy of the report. → ___ received a copy of the report. = Every officer ; Each officer ; All the officers ; All of the officers ; Each of the officers | hint: Every + singular countable noun.
4. Both suspect was questioned again. → ___ questioned again. = Both suspects were ; Both the suspects were ; Both of the suspects were | hint: Both + plural noun and plural verb.
5. She was wearing many jewellery when she disappeared. → She was wearing ___ when she disappeared. = a lot of jewellery ; lots of jewellery ; a lot of jewelry ; lots of jewelry | hint: Jewellery is uncountable.
6. Few evidence was available, so the investigation stalled. → ___ was available, so the investigation stalled. = Little evidence ; Very little evidence | hint: Almost none of an uncountable noun.

## 5. Make the English natural
TYPE: choose
TEXT: These sentences are based on language problems from your previous writing. Choose the most natural correction.
1. We cleaned the flat to state it was before. = We cleaned the flat to return it to the way it was before. | options: We cleaned the flat to return it to the way it was before. ; We cleaned the flat to state it was before. ; We cleaned the flat to return it as before.
2. Some people place traditions in the first place. = Some people put traditions first. | options: Some people put traditions first. ; Some people place traditions in the first place. ; Some people put traditions at the first place.
3. The second moment is that the business creates jobs. = Another point is that the business creates jobs. | options: Another point is that the business creates jobs. ; The second moment is that the business creates jobs. ; Another moment is the business creates jobs.
4. The industry has a big commercial benefits. = The industry has significant commercial benefits. | options: The industry has a big commercial benefits. ; The industry has significant commercial benefits. ; The industry has much commercial benefits.
5. It could be problem in some regions. = It could be a problem in some regions. | options: It could be problem in some regions. ; It could be a problem in some regions. ; It could be problems in some regions.
6. They don't have much resources for recycling. = They don't have many resources for recycling. | options: They don't have many resources for recycling. ; They don't have much resources for recycling. ; They don't have a many resources for recycling.

## 6. Your turn: a cyberpunk city
TYPE: open
TEXT: Describe a city from a cyberpunk anime or game you know, or invent your own. Write **90–120 words**.
- What is there plenty of, and what is there too little of?
- What do a few people have that none of the others can afford?
- What unspoken rules does everyone follow there?
TEXT: Use **at least four** different quantifiers (e.g. *plenty of, very little, a few, none of, neither, enough*) and **two** expressions from part 1.
