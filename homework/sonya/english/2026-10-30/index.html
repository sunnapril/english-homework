STUDENT: Sonya
HOMEWORK: Halloween · The Secret Door · due 30.10.2026
TITLE: Halloween · The Secret Door
TAG: Halloween · due 30 October · about 15 minutes
INTRO: Four Halloween mysteries are waiting for you! Read the clues, choose the answers and create your own Halloween story.

## 1 · What's behind the door?
TYPE: choose
TEXT: Read each clue. Choose the correct answer.
1. It is orange. You can make a funny face on it. ___ = a pumpkin | options: a pumpkin ; a spider ; a broom | hint: People often put a candle inside it at Halloween.
2. It is a person who can make magic potions. ___ = a witch | options: a knight ; a witch ; a ghost | hint: This character often flies on a broom.
3. You find it in a spider's home. ___ = a cobweb | options: a bubble ; a cobweb ; a clue | hint: It is made by a spider.
4. You use it to find the answer to a mystery. ___ = a clue | options: a crumb ; a claw ; a clue | hint: It helps you solve a mystery.

## 2 · Halloween words
TYPE: gap
TEXT: Complete the sentences. Use the words from the bank. Two words are extra.
BANK: ghost; witch; broom; spider; candle; mask; candy; skeleton
1. A ___ can fly on a broom. = witch | hint: This Halloween character makes magic potions.
2. A ___ has eight legs. = spider | hint: You can find it in a cobweb.
3. A ___ is inside the pumpkin. = candle | hint: It gives us light.
4. A ___ can walk through walls. = ghost | hint: You can't usually see this character in real life.
5. I wear a scary ___ at the Halloween party. = mask | hint: You put it on your face.
6. Children get ___ on Halloween. = candy | hint: It is sweet. You can eat it.

## 3 · Who is it?
TYPE: choose
TEXT: Meet the monster roommates! Choose the correct word or verb form to complete each sentence.
1. The ghost ___ walk through walls. = can | options: can ; can't ; cans | hint: A ghost doesn't need a door.
2. The vampire ___ in a coffin during the day. = sleeps | options: sleep ; sleeps ; sleeping | hint: The subject is he. Use Present Simple.
3. The werewolf ___ loudly at midnight. = sings | options: sing ; sings ; singing | hint: The werewolf is one character. Use Present Simple.
4. The robot ___ fly on a broom. = can't | options: can ; can't ; cans | hint: In this story, the robot can clean the room, but it cannot fly.
5. The witch ___ magic potions. = makes | options: make ; makes ; making | hint: The subject is she. Use Present Simple.

## 4 · My Secret Door Story
TYPE: open
TEXT: You open a small door. Behind it, you see something strange! Choose one idea:
- A. A friendly ghost
- B. A witch with a magic potion
- C. A tiny spider with a big pumpkin
IMAGE: ideas.jpg | A: a friendly ghost, B: a witch with a magic potion, C: a tiny spider with a big pumpkin
TEXT: Write 2–3 sentences: what is behind the door, and what your TikTok video would be about.
SUPPORT: Behind the door, I see … · It is scary / funny / cute / strange. · My TikTok video would be about … · In my video, … · I would show … · I think it would be funny / scary because …
PROMPT: What is behind your door, and what would your TikTok video show?
