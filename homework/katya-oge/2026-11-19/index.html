5. Talking to friends is good for you. = True | options: True ; False | hint: Do a favourite activity…
6. It's a good idea to go to bed at the same time every night. = True | options: True ; False | hint: Последний совет.
SCRIPT: How to manage stress
SCRIPT: Like adults, it's normal for teenagers to feel stress, and it can be useful at times. A bit of stress helps you to complete your daily routine. But stress isn't good when it makes you unhappy or worried. So, why not try these ways to relax?
SCRIPT: Do daily exercise. Go for a run or a bike ride or just go for a walk! Walking quickly for an hour every day gives you all the exercise you need.
SCRIPT: Do breathing exercises. You don't normally think when you breathe, but when you breathe very slowly, it relaxes you. Just do these exercises for five minutes at different times during the day!
SCRIPT: Do a favourite activity. When you take a break to do something you love, you relax and feel good. So, watch some TV, talk to friends or maybe make a cake!
SCRIPT: Sleep for 8–10 hours a night. To sleep well, don't use electronic gadgets for an hour before bedtime – read a good book instead! And go to bed at a regular time too.

## 8 · Словообразование · A day at the museum
TYPE: gap
TEXT: Образуй от слова в скобках новое слово, которое подходит по смыслу. Пригодятся знакомые части слова: **-ment**, **-tion / -sion**, **-ful / -less**, **un-**, **-y** (apologise → apology).
1. Our class trip to the science museum needed careful ___. **(ARRANGE)** = arrangement | hint: Нужно существительное. Окончание -ment.
2. At the start, the guide gave us a short ___ of the rules. **(EXPLAIN)** = explanation | hint: Существительное. Написание меняется: explain → expla…
3. We needed ___ to take photos inside. **(PERMIT)** = permission | hint: Существительное. Как decide → decision, только t → ss.
4. The dancing robots were the best ___ of the day. **(ENTERTAIN)** = entertainment | hint: Существительное, окончание без изменений слова.
5. One experiment looked dangerous, but it was completely ___. **(HARM)** = harmless | hint: Не опасный — без вреда.
6. Under each robot there was a short ___ on a card. **(DESCRIBE)** = description | hint: Существительное. -be → -ption, как subscribe → subscription.
7. When we got back, our teacher made an ___ to the driver because we were late. **(APOLOGISE)** = apology | hint: Существительное. -ise → -y.
8. I was really ___: I lost my ticket on the way home. **(LUCKY)** = unlucky | hint: Нужен противоположный смысл.
