STUDENT: Katya OGE
HOMEWORK: Films, free time and few · due 26.11.2026
TITLE: Films, free time and few
TAG: Слова, verb или noun, little / few, видео · около 40 минут
INTRO: Сначала вспомни слова с урока, потом посмотри короткое видео про фильмы и сериалы. Текст и ответы открывай только после своей попытки.

## 1 · Вспомни слова
TYPE: gap
TEXT: Банка слов нет: в скобках первые буквы. Напиши слово или выражение целиком.
1. My little brother left a terrible ___ (m…) in the bathroom. = mess | hint: Беспорядок.
2. From the top of the ___ (h…) you can see the whole river. = hill | hint: Как маленькая гора.
3. My headphones don't work. Can you help me ___ (f…) them? = fix | hint: Починить.
4. Look at the ___ (t…): the next train leaves at 6:15. = timetable | hint: Расписание.
5. Nobody in our class could ___ (s…) the last maths problem. = solve | hint: Найти ответ.
6. I'm late! I need to get dressed ___ (q…). = quickly | hint: Быстро. Наречие на -ly.
7. What do you like doing in your ___ (f… t…)? = free time | hint: Время, когда нет уроков. Два слова.

## 2 · Verb or noun?
TYPE: gap
TEXT: Глагол или существительное? Выбери слово из банка. **Одно слово лишнее.** Помни: после **to / can / let's** — глагол, после **a / the / my / all the** — существительное.
BANK: explain; explanation; arrange; arrangements; prepare; preparation; solve; solution; agree
1. Can you ___ the rule again? I didn't understand it. = explain | hint: После Can you → глагол.
2. Mum made all the ___ for my birthday party: food, music and games. = arrangements | hint: После all the → существительное (их много).
3. The ___ for the exam took me a whole month. = preparation | hint: После The → существительное.
4. I can't ___ this crossword — it's too difficult. = solve | hint: После can't → глагол.
5. We need to ___ a meeting with the whole class. = arrange | hint: После to → глагол.
6. The teacher's ___ was clear, so everybody understood. = explanation | hint: После teacher's → существительное.
7. Is there a ___ to the noise problem in our flat? = solution | hint: После a → существительное.
8. Let's ___ for the trip tonight: pack our bags and check the tickets. = prepare | hint: После Let's → глагол.

## 3 · Little or few?
TYPE: gap
TEXT: Напиши **little**, **a little**, **few** или **a few**.
BANK: little; a little; few; a few
1. Can I have ___ water, please? I'm thirsty. = a little | hint: Water — неисчисляемое. Немного, но хватит.
2. Very ___ students like Monday mornings. = few | hint: Students — исчисляемое. Почти никто.
3. I've got ___ minutes before the bus — let's buy a snack. = a few | hint: Minutes — исчисляемое. Несколько.
4. There was very ___ snow this winter, so we couldn't make a snowman. = little | hint: Snow — неисчисляемое. Почти нет.
5. My grandma speaks ___ English — enough to say hello and thank you. = a little | hint: Неисчисляемое, немного.
6. I invited ___ friends to my birthday — only three. = a few | hint: Исчисляемое, несколько.

## 4 · Видео · TV & Movies
TYPE: choose
TEXT: Три человека на улице рассказывают о сериалах и фильмах (1 минута 49 секунд). Сначала открой словарь (New vocabulary). Посмотри видео и выбери ответ. Если видео не включается, включи VPN.
VIDEO: https://youtu.be/-q0_fN9dNTY | Street interviews · TV & Movies | embed
VOCAB: **selective** | choosing carefully, not everything | избирательный, разборчивый
VOCAB: **a programme** | a show on TV | телепередача, программа
VOCAB: **up to date** | knowing the latest news | в курсе последних новостей
VOCAB: **of all time** | ever | всех времён
VOCAB: **particular** | special, specific | особый, определённый
VOCAB: **tend to** | usually do something | обычно (делать что-то)
1. How much TV does Andrew watch in the evening? = about two hours | options: about half an hour ; about two hours ; about four hours | hint: Maybe two hours a…
2. Does Andrew think he watches too much TV? = Yes, he does. | options: No, he doesn't. ; Yes, he does. | hint: I probably do.
3. What does Andrew think about TV in general? = There aren't a lot of good programmes. | options: There are a lot of great programmes. ; There aren't a lot of good programmes. ; He thinks TV is only for children. | hint: He is very selective.
4. Which programmes does he like? = action shows, comedies and the news | options: cartoons and reality shows ; sport and music shows ; action shows, comedies and the news | hint: He wants to keep up to date.
5. What is Helen's favourite film of all time? = Dirty Dancing | options: Dirty Dancing ; Titanic ; Mamma Mia! | hint: Второй человек, Helen.
6. How many times has Helen seen it? = about 25 | options: about 5 ; about 15 ; about 25 | hint: Очень много раз!
7. Why does Helen like the film? = It has dancing and it's romantic. | options: It's funny and short. ; Her friends love it. ; It has dancing and it's romantic. | hint: Танцы и…
8. What kind of film endings does Andy prefer? = sad | options: happy ; sad ; open | hint: Третий человек, Andy.
9. Why does Andy prefer this kind of ending? = He has no particular reason. | options: Sad endings make him think. ; He has no particular reason. ; Sad endings are more realistic. | hint: particular reason

## 5 · Видео · Одно слово
TYPE: gap
TEXT: Посмотри ещё раз и впиши **одно** пропущенное слово. Помни: **much** — с неисчисляемыми (TV, time), **many** — с исчисляемыми (times, films).
1. How ___ TV do you watch? = much | hint: TV — неисчисляемое.
2. Maybe two hours ___ night. = a | hint: Каждый вечер: two hours … night.
3. Do you think you watch ___ much TV? = too | hint: Слишком.
4. What's your favourite film of ___ time? = all | hint: Всех времён.
5. How ___ times have you seen it? = many | hint: Times — исчисляемое.
6. I have ___ particular reason. = no | hint: Нет особой причины.

## 6 · Твоё мнение
TYPE: open
TEXT: Ответь на два вопроса, всего **4–6 предложений**: ответ → **because** … → **For example**, … Если ответ «не знаю», начни с **It depends on** …
SUPPORT: I watch … a day / a week · I prefer happy / sad endings because … · For example, … · It depends on the film / my mood / my homework …
PROMPT: How much TV or YouTube do you watch? Do you prefer films with happy or sad endings? Why?
