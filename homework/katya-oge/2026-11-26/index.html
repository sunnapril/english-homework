STUDENT: Katya OGE
HOMEWORK: Films, free time and few · due 26.11.2026
TITLE: Films, free time and few

## 1 · Вспомни слова
TYPE: gap
TEXT: Банка слов нет: в скобках первые буквы. Напиши слово или выражение целиком.
1. My little brother left a terrible ___ (m…) in the bathroom. = mess | hint: Беспорядок.
2. From the top of the ___ (h…) you can see the whole river. = hill | hint: Как маленькая гора.
3. My headphones don't work. Can you help me ___ (f…) them? = fix | hint: Починить.
4. Look at the ___ (t…): the next train leaves at 6:15. = timetable | hint: Расписание.
5. Nobody in our class could ___ (s…) the last maths problem. = solve | hint: Найти ответ.
6. I'm late! I need to get dressed ___ (q…). = quickly | hint: Быстро. Наречие на -ly.
7. What do you like doing in your ___ (f… t…)? = free time | hint: Время, когда нет уроков. Два слова.

## 2 · Verb or noun?
TYPE: gap
TEXT: Глагол или существительное? Выбери слово из банка. **Одно слово лишнее.** Помни: после **to / can / let's** — глагол, после **a / the / my / all the** — существительное.
BANK: explain; explanation; arrange; arrangements; prepare; preparation; solve; solution; agree
1. Can you ___ the rule again? I didn't understand it. = explain | hint: После Can you → глагол.
2. Mum made all the ___ for my birthday party: food, music and games. = arrangements | hint: После all the → существительное (их много).
3. The ___ for the exam took me a whole month. = preparation | hint: После The → существительное.
4. I can't ___ this crossword — it's too difficult. = solve | hint: После can't → глагол.
5. We need to ___ a meeting with the whole class. = arrange | hint: После to → глагол.
6. The teacher's ___ was clear, so everybody understood. = explanation | hint: После teacher's → существительное.
7. Is there a ___ to the noise problem in our flat? = solution | hint: После a → существительное.
8. Let's ___ for the trip tonight: pack our bags and check the tickets. = prepare | hint: После Let's → глагол.

## 3 · Little or few?
TYPE: gap
TEXT: Напиши **little**, **a little**, **few** или **a few**.
BANK: little; a little; few; a few
1. Can I have ___ water, please? I'm thirsty. = a little | hint: Water — неисчисляемое. Немного, но хватит.
2. Very ___ students like Monday mornings. = few | hint: Students — исчисляемое. Почти никто.
3. I've got ___ minutes before the bus — let's buy a snack. = a few | hint: Minutes — исчисляемое. Несколько.
4. There was very ___ snow this winter, so we couldn't make a snowman. = little | hint: Snow — неисчисляемое. Почти нет.
5. My grandma speaks ___ English — enough to say hello and thank you. = a little | hint: Неисчисляемое, немного.
6. I invited ___ friends to my birthday — only three. = a few | hint: Исчисляемое, несколько.

## 4 · Аудио · Teenage stress
TYPE: choose
TEXT: Мама подростка (Louise) и подросток (Max) спорят в интернете: «Today's teenagers do too many after-school activities. Do you agree?» Послушай один раз. Кто так думает — **Louise** или **Max**?
AUDIO: life-vision-elementary-sb-track-1.13.mp3
VOCAB: **stressed** | so worried and tired that you can't relax | в стрессе, напряжённый
VOCAB: **stress** | worry caused by problems in your life | стресс
VOCAB: **after-school activities** | clubs, sports and classes after lessons | занятия после уроков
1. Stress prepares teenagers for their future. = Louise | options: Louise ; Max | hint: Stress is a normal part of life, especially at work…
2. Teenagers need to have free time. = Max | options: Max ; Louise | hint: …we need some time to relax and do nothing.
3. Too much free time is bad for teenagers. = Louise | options: Louise ; Max | hint: …teens who have lots of free time do more unhealthy things.
4. Stress is unhealthy for teenagers. = Max | options: Max ; Louise | hint: When I'm stressed, I don't work well.
5. Stress teaches teenagers how to manage their time. = Louise | options: Max ; Louise | hint: Busy students learn to plan their schoolwork.
6. Teenagers and adults want different things. = Max | options: Louise ; Max | hint: …our parents tell us that we haven't got time.

TEXT: Послушай ещё раз и выбери короткий ответ.
AUDIO: life-vision-elementary-sb-track-1.13.mp3

## 6 · Аудио · Если ответ «нет»
TYPE: gap
TEXT: Послушай запись ещё раз. Когда ответ «No», дай правильную информацию: впиши **одно** слово из аудио. Если что-то не расслышала, открой текст записи под аудио.
AUDIO: life-vision-elementary-sb-track-1.13.mp3
1. Not all students go home: many go to after-school clubs or ___ classes. = language | hint: Например, English или Italian classes.
2. At after-school clubs, teens learn ___ skills, like website design, or do sports. = practical | hint: Полезные в жизни навыки.
3. Teenagers watch TV after school because they need a ___. = break | hint: Перерыв, отдых.
SCRIPT: Some people say that today's teenagers do too many after-school activities. Do you agree?
SCRIPT: Louise: No, I don't.
SCRIPT: 1 It's good to be busy. Stress is a normal part of life, especially at work, so students need to understand this at high school.
SCRIPT: 2 Many high school students do about four hours of homework per subject a week, and they also go to after-school clubs or language classes. Busy students learn to plan their schoolwork, and then they have time for their favourite activities. They understand that it isn't possible to do everything!
SCRIPT: 3 I think that teens who have lots of free time do more unhealthy things, for example, they spend hours on their phones or play video games. Instead, at after-school clubs, teens can learn practical skills, like website design or how to make meals. And team sports are very good for students – they get fit and learn to work together.
SCRIPT: Max: Yes, I do.
SCRIPT: 4 Doing things all at the same time isn't good for us. When I'm stressed, I don't work well. Some of my classmates do their homework very quickly because they have lots of activities in the afternoon, but they don't always get good results.
SCRIPT: 5 After a long day at school, we need some time to relax and do nothing. We just want to go home and watch TV or listen to music on our phones because we're very tired and we need a break! People with more free time are also more creative and do things like draw or make videos.
SCRIPT: 6 My friends and I want to do more activities after school, but we also need to do all our homework and make our teachers happy. And we're stressed because we want to do fun things in the afternoons, like ride our bikes outdoors, read comics or play board games, but our parents tell us that we haven't got time because of our schoolwork …

## 8 · Видео · Одно слово
TYPE: gap
TEXT: Посмотри ещё раз и впиши **одно** пропущенное слово. Помни: **much** — с неисчисляемыми (TV, time), **many** — с исчисляемыми (times, films).
1. How ___ TV do you watch? = much | hint: TV — неисчисляемое.
2. Maybe two hours ___ night. = a | hint: Каждый вечер: two hours … night.
