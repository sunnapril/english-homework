STUDENT: Katya OGE
HOMEWORK: The Mystery of the Broken Phone · due 02.11.2026
TITLE: The Mystery of the Broken Phone
TAG: OGE · Retrieval, Active/Passive, Listening & Storytelling · ~25 min
INTRO: Remember the words you struggled with, listen to Molly and write your own story.

## 1 · Remember?
TYPE: gap
TEXT: Complete the sentences with ONE word. There is no word bank. Think about the meaning and the correct form.
1. Can I ___ your phone for a minute? Mine is broken. = borrow | hint: Use something that belongs to another person and give it back.
2. You ___ tell your mum what happened. = should | hint: Give advice. The next verb is in its base form.
3. After a busy day, I like to ___ and listen to music. = relax ; rest | hint: Rest and stop worrying.
4. ___ my sisters enjoy detective stories. = Both | hint: Two people, not just one.
5. He ___ the ball across the garden yesterday. = threw | hint: Past Simple of throw.
6. We went to the shop to ___ some milk. = buy ; get | hint: After went to + place, use to + base verb to explain the purpose.

## 2 · Active or Passive?
TYPE: choose
TEXT: Choose the form that makes sense. Think about WHO did something, WHAT happened, and WHICH event happened first.
1. Yesterday, Emma ___ her brother's phone by accident. = broke | options: broke ; was broken ; had been broken | hint: Emma did the action.
2. The kitchen window ___ by a football last night. = was broken | options: broke ; was broken ; had broken | hint: The window received the action. "By a football" tells us what did it.
3. By the time Jack came home, his sister ___ his phone. = had broken | options: breaks ; was broken ; had broken | hint: The sister broke it before Jack arrived.
4. Jack's phone ___ when his sister dropped it. = was damaged | options: damaged ; was damaged ; had damaged | hint: The phone did not do anything. Something happened to it.

## 3 · Listen to Molly
TYPE: open
TEXT: Listen to Molly talking about yoga and her daily routine. Then answer the question.
AUDIO: /homework/sonya/english/wb8-10-real-english-listening/audio/wb_track_1_04.mp3
SCRIPT: Molly: Yoga is part of my daily routine. I do it for ten minutes in my bedroom when I get up in the morning. Then I have a shower, get dressed, have some breakfast and go to school. And I'm ready to study!
SCRIPT: After school, I have lots of things to do: piano lessons on Tuesdays and tennis lessons on Thursdays. Then, in the evening, I have dinner and do my homework in the dining room. There's no time to watch TV!
SCRIPT: I'm always tired after my busy day, but I can't relax. That's when I do more yoga. I do it for 30 minutes before I go to bed, and then it's easy to sleep!
SCRIPT: Now, it's time for you to do some yoga … You're probably new to yoga, but don't worry about it … just watch, listen and copy me …
SUPPORT: Molly does yoga twice a day: … · In the evening, she feels … but she can't … · Yoga helps her …
PROMPT: When does Molly do yoga, and why does she do it in the evening? Answer in 2–3 sentences.

## 4 · Listen again: the details
TYPE: gap
TEXT: Listen again and complete the information. Write ONE word or number in each gap.
1. Molly does yoga for ___ minutes in the morning. = ten ; 10 | hint: Listen to the beginning.
2. On Tuesdays, Molly has ___ lessons. = piano | hint: An activity involving a musical instrument.
3. On Thursdays, she has ___ lessons. = tennis | hint: A sport.
4. In the evening, she does yoga for ___ minutes. = thirty ; 30 | hint: It is longer than in the morning.

## 5 · Write the story
TYPE: open
TEXT: Write a story of 50–70 words. Use this plan:
- 1. A girl takes her older brother's phone from his desk while he is out.
- 2. She drops it on the floor, and the screen cracks.
- 3. Her brother comes home and finds the broken phone. She apologises.
TEXT: Explain what happened first, what the brother discovered and how the story ended. Use Past Perfect at least once for an earlier event and give one piece of advice with **should**.
SUPPORT: At first… · Suddenly… · When her brother came back… · She had already… · The phone was… · She apologised… · She should… · In the end…
PROMPT: Story: what happened to the phone, how did the brother find out, and what should the sister do?
