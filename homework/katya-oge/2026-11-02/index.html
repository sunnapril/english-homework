## 1 · Remember?
TYPE: gap
TEXT: Complete the sentences with ONE word. There is no word bank: the first letter is in the gap. Write the whole word. Think about the meaning and the correct form.
1. Can I ___ (b…) your phone for a minute? Mine is broken. = borrow | hint: Use something that belongs to another person and give it back.
2. You ___ (s…) tell your mum what happened. = should | hint: Give advice. The next verb is in its base form.
3. After a busy day, I like to ___ (r…) and listen to music. = relax ; rest | hint: Rest and stop worrying.
4. ___ (B…) my sisters enjoy detective stories. = Both | hint: Two people, not just one.
5. He ___ (t…) the ball across the garden yesterday. = threw | hint: Past Simple of throw.
6. We went to the shop to ___ (b…) some milk. = buy | hint: After went to + place, use to + base verb to explain the purpose.

## 2 · OGE grammar · The broken phone
TYPE: gap
TEXT: OGE format. Read the story. Change the word in CAPITALS so that it fits the sentence. Write one form only (it can be two or three words, e.g. was broken).
IMAGE: broken-phone.jpg | 1: a girl takes her brother's phone from his desk. 2: the phone falls and the screen cracks. 3: the brother holds the broken phone; his sister apologises.
1. Last Saturday, Jack ___ to football practice and left his phone at home. (GO) = went | hint: Last Saturday → Past Simple. GO is irregular.
2. His younger sister Emma ___ to take a photo of her cat with it. (WANT) = wanted | hint: Past Simple, regular verb.
3. His phone was much ___ than hers, so she held it carefully. (HEAVY) = heavier | hint: Comparative: than → -er. Y changes to i.
4. Suddenly the cat jumped, and Emma ___ the phone on the floor. (DROP) = dropped | hint: Past Simple: double the last consonant.
5. By the time Jack came home, she ___ the phone under a cushion. (HIDE) = had hidden | hint: By the time … → the action happened earlier: had + third form (hide – hid – hidden).
6. The next day the phone ___ in a small shop near the school. (REPAIR) = was repaired | hint: The phone did not repair itself. Somebody repaired it → Passive: was + third form.
7. "It was the ___ day of my week," Jack said. (BAD) = worst | hint: Superlative of bad: bad – worse – the …

## 3 · OGE word formation
TYPE: gap
TEXT: OGE format. Form a new word from the word in CAPITALS so that it fits the sentence.
1. Emma felt very ___ about what she had done. (HAPPY) = unhappy | hint: You need the opposite meaning. Add a prefix.
2. Jack listened to her ___ and decided to forgive her. (APOLOGISE) = apology | hint: You need a noun after her.
3. "Please be more ___ with other people's things," he said. (CARE) = careful | hint: You need an adjective after be more. Add a suffix.
