## 3 · The Kremlin Stars: Symbols and Engineering
TYPE: info
TEXT: Stars have been used as symbols for thousands of years. They can represent protection, power, unity, or guidance. Today, many countries display stars on their national flags. The flag of China features five golden stars, while the flag of the USA contains fifty white stars, one for each of the states. The Turkish flag features a star together with a crescent moon, and Jordan has a white star inside a red triangle on its flag.
TEXT: Perhaps the most remarkable stars are not found on flags at all, but on buildings. Lots of Russian cities have stars as part of architectural design, but the five Kremlin stars are a real engineering wonder. They are located on the five towers of the Moscow Kremlin and can be clearly seen at night. The stars are made to fit the height of each of the towers and rotate slowly to resist strong winds.
TEXT: The stars appeared on the Kremlin towers in the mid-1930s to replace the old imperial eagles. Their mechanism was designed by Fedor Yudovsky, who wasn't an architect but a well-known engineer and whose laboratory specialized in powerful electric lighting systems for industry and film production. Due to his engineering expertise, the Soviet authorities chose Fedor Yudovsky to lead the Kremlin Stars project.
TEXT: The stars turned out to be a unique engineering challenge. Yudovsky had to create a lighting system that was bright enough to be visible from a great distance but compact enough to fit inside the stars. Existing lamps were either too large, too heavy, or generated too much heat.
TEXT: Common materials were not suitable: glass melted, and the light was uneven. Yudovsky suggested using ruby glass and special reflectors that spread the light evenly. To prevent the stars from going dark if a lamp failed, he proposed using two lamps inside each star. This made the system more reliable and easier to maintain. Later, engineers improved the colour of the glass by adding selenium, which gave the stars a deeper red colour.
TEXT: The Kremlin stars were first lit in November 1937. Since then, they have been turned off only for a few special situations. For example, in 1996, the Kremlin towers were featured in a historical film. The director asked to turn off two of the stars as they did not exist at the time depicted in the film. Before that, the stars had been turned off only during World War II, when they did not shine for four years.
TEXT: In 1945, it was decided to put the Kremlin stars to work again. Sadly, Fedor Yudovsky had died during the war, and the original drawings were lost. The only person who tried to restore the stars was his wife. She was also an engineer and knew her husband's work better than anyone else. She became the new leader of the laboratory and completed the task. In June 1945, just in time to celebrate the Victory Parade, the stars started to shine again.
