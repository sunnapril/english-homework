## 2 · Words in new contexts
TYPE: gap
TEXT: Complete the sentences with words from the scene. Use the correct form. **One expression is extra.**
BANK: look the other way; disband; make waves; inch toward; inner sanctum; legacy; turn down; beat someone at their own game; foe
1. The editors knew about the problem, but they decided to ___ and pretend nothing had happened. = look the other way | hint: ignore it
2. After the merger, the old committee was ___, and its members joined other teams. = disbanded | hint: passive, past participle
3. She didn't want to ___ in her first week, so she kept her opinions to herself. = make waves | hint: cause trouble
4. After three long nights, the negotiators finally ___ an agreement. = inched toward ; inched towards | hint: slowly, past simple
5. The director's office was the ___ of the company: nobody went in without an invitation. = inner sanctum | hint: the most private place
6. He got into the university partly because he was a ___: his father and grandfather had studied there. = legacy | hint: family connection
7. They offered her the job, but she ___ because the salary was too low. = turned it down ; turned the job down ; turned down the job | hint: refused it (3 words)
8. The young player studied her rival's favourite tricks and finally ___. = beat him at his own game | hint: use his own methods against him
