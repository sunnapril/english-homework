## 2 · Detective listening · 5 min
TYPE: fix
TEXT: Here is a short retelling of the bit, but **each sentence has one factual mistake**. Correct only the wrong word inside the sentence.
1. He knows his bag is heavy because he packed it at the airport. = He knows his bag is heavy because he packed it at home.
2. The agent tells him that his bag is five pounds over. = The agent tells him that his bag is two pounds over.
3. He has to open his bag in front of about twenty people. = He has to open his bag in front of about 187 people. ; He has to open his bag in front of about 180 people. ; He has to open his bag in front of about a hundred and eighty-seven people. ; He has to open his bag in front of about two hundred people.
4. He says the man behind him in the queue weighs about 200 pounds. = He says the man behind him in the queue weighs about 500 pounds.

## 3 · Travel light: words in new situations · 10 min
TYPE: gap
TEXT: Complete the sentences. **One word or phrase is extra.**
BANK: pack light; hand luggage; overweight; weigh; check in; fee; essentials; fit
1. I always ___: one small backpack is enough for a weekend in Kazan. = pack light | hint: take only a few things
2. My suitcase was three kilos ___, so I had to pay extra. = overweight | hint: heavier than allowed
3. The airline charges a 40-euro ___ for every extra bag. = fee | hint: money you pay for a service
4. You don't need to ___ your bag: it's small enough to take on the plane. = check in | hint: give your bag to the airline at the desk
5. Before you go to the airport, ___ your suitcase on the bathroom scales. = weigh | hint: find out how heavy something is
6. I took only the ___: my passport, phone, charger and a toothbrush. = essentials | hint: the most necessary things
7. My jacket didn't ___ in the backpack, so I wore it on the plane. = fit | hint: have enough space
