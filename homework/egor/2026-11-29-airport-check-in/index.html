## 1 · Words to bring back · 5 min
TYPE: gap
TEXT: Complete each sentence with one phrase from the bank. The phrases come from different earlier lessons. **One phrase is extra.**
BANK: blanked out; charm; prevent; take a toll on; pitfall; vice versa; eventually
1. I knew his name, but I suddenly ___ when I introduced him. = blanked out | hint: suddenly forgot everything
2. The old town has a lot of ___, especially in the evening. = charm | hint: an attractive quality
3. A proper warm-up can ___ some sports injuries. = prevent | hint: stop something from happening
4. Several nights of poor sleep can ___ your concentration. = take a toll on | hint: gradually have a bad effect
5. One common ___ of booking the cheapest hotel is its location. = pitfall | hint: a hidden problem
6. He helps me with English, and ___: I help him with maths. = vice versa | hint: the same, but the other way round

## 2 · Watch: two pounds over (0:00–2:25) · 10 min
TYPE: choose
TEXT: First open the box “New vocabulary” above the video and read the words. Then watch **0:00–2:25** and answer the questions. You can turn on English subtitles.
VIDEO: https://www.youtube.com/watch?v=lXZMlEy7fb4 | Sebastian Maniscalco · Checking in at the airport | embed
VOCAB: **check-in** | the desk at the airport where you show your ticket and leave your big bag | регистрация на рейс
VOCAB: **weight allowance** | how heavy your bag can be without paying more | норма веса багажа
VOCAB: **owe** | to have to pay money to someone | быть должным
VOCAB: **scale** | a machine that shows how heavy something is | весы
VOCAB: **pound** | a unit of weight, about 0.45 kg | фунт (≈ 0,45 кг)
VOCAB: **carry-on** | a small bag you take with you on the plane | ручная кладь
VOCAB: **scam** | a dishonest way to get people's money | развод, надувательство
1. How do the check-in agents behave, according to him? = They don't look at you or smile. | options: They are very friendly and chatty. ; They don't look at you or smile. ; They are always in a hurry.
2. When do the agents get happy? = when a bag is over the weight allowance | options: when the queue is short ; when their shift ends ; when a bag is over the weight allowance
3. What does he try to do when he puts the bag on the scale? = put it down very gently so that it seems lighter | options: put it down very gently so that it seems lighter ; hold one end of the bag with his foot ; take some things out before the agent looks
4. What does he take out of his bag? = a boot, a sock and toothpaste | options: a jacket and two books ; a boot, a sock and toothpaste ; his laptop and a bottle of water
5. Where does the agent tell him to put these things? = in his carry-on | options: in the rubbish bin ; in his wife's bag ; in his carry-on
6. Why does he think the whole thing is a scam? = The things still go on the same plane. | options: The things still go on the same plane. ; The fee is higher than the ticket. ; The scale shows the wrong weight.

## 3 · Detective listening · 5 min
TYPE: fix
TEXT: Here is a short retelling of the bit, but **each sentence has one factual mistake**. Correct only the wrong word inside the sentence.
1. He knows his bag is heavy because he packed it at the airport. = He knows his bag is heavy because he packed it at home.
2. The agent tells him that his bag is five pounds over. = The agent tells him that his bag is two pounds over.
3. He has to open his bag in front of about twenty people. = He has to open his bag in front of about 187 people. ; He has to open his bag in front of about 180 people. ; He has to open his bag in front of about a hundred and eighty-seven people. ; He has to open his bag in front of about two hundred people.
4. He says the man behind him in the queue weighs about 200 pounds. = He says the man behind him in the queue weighs about 500 pounds.

## 4 · Travel light: words in new situations · 7 min
TYPE: gap
TEXT: Complete the sentences. **One word or phrase is extra.**
BANK: pack light; hand luggage; overweight; weigh; check in; fee; essentials; fit
1. I always ___: one small backpack is enough for a weekend in Kazan. = pack light | hint: take only a few things
2. My suitcase was three kilos ___, so I had to pay extra. = overweight | hint: heavier than allowed
3. The airline charges a 40-euro ___ for every extra bag. = fee | hint: money you pay for a service
4. You don't need to ___ your bag: it's small enough to take on the plane. = check in | hint: give your bag to the airline at the desk
5. Before you go to the airport, ___ your suitcase on the bathroom scales. = weigh | hint: find out how heavy something is
6. I took only the ___: my passport, phone, charger and a toothbrush. = essentials | hint: the most necessary things
7. My jacket didn't ___ in the backpack, so I wore it on the plane. = fit | hint: have enough space

## 5 · The precise phrase · 5 min
TYPE: gap
TEXT: Restore the phrase with the exact meaning. No bank this time: use the hint.
1. After five hours of gaming, I was suffering from sleep ___. = deprivation | hint: not getting enough sleep
2. I kept forgetting the answer, so I started to ___ around the room. = pace | hint: walk back and forth
3. Before an exam, I usually have to hit the ___. = books | hint: start studying seriously
4. The team completely ___ their opponents in the final. = smoked | hint: informal: beat very easily (past form)

## 6 · Your story · 10 min
TYPE: open
TEXT: Do you pack light or take everything "just in case"? What annoys you most at an airport or a station? Write **50–70 words**.
