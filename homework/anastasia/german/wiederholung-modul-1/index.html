## 1 · Das ist Familie Gruber · AB S. 20, Ü. 1
TYPE: gap
TEXT: Составьте слова из слогов и вставьте их в блог Эльвиры.
TEXT: Пример: Hallo, mein **Name** (Na + me) ist Elvira Gruber.
BANK: ver; Be; der; en; Eng; gle; hei; Jah; Jour; Kin; lisch; Spa; listin; ni; nisch; Ös; ra; re; ter; na; reich; ruf; Sin; Sohn; Spa; ter; tet; Toch
1. Ich bin ___, mein Mann heißt Edmund. = verheiratet | hint: ver + … + … + … · женат / замужем
2. Er ist 75 ___ alt. = Jahre | hint: Jah + …
3. Wir leben in Linz, das ist in ___. = Österreich | hint: Ös + … + … · страна, столица — Вена
4. Wir haben zwei ___: Susanne und Frank. = Kinder | hint: Kin + …
5. Susanne arbeitet als ___ bei News News News. = Journalistin | hint: Jour + … + … · журналистка
6. Sie ist geschieden und hat einen ___, Markus, … = Sohn
7. … und eine ___, Isabel. = Tochter | hint: Toch + …
8. Frank lebt allein, er ist ___. = Single | hint: Sin + … · живёт один
9. Er wohnt in Madrid, in ___. = Spanien | hint: Spa + … + … · страна
10. Von ___ ist er Architekt. = Beruf | hint: Be + … · von Beruf = по профессии
11. Er spricht sehr gut ___ … = Spanisch | hint: Spa + … · язык
12. … und ___. = Englisch | hint: Eng + … · язык

## 6 · Wo, wie, wer …? · AB S. 21, Ü. 7
TYPE: gap
TEXT: В учебнике это аудиотренинг: слушайте предложение и в паузе задавайте вопрос **вслух**.
TEXT: **Дополнительно:** потом напишите свои вопросы. В конце каждого предложения вы слышите, кого спрашивать: **du**, **Sie** или **das**.
TEXT: Пример: «Ich komme aus Spanien. – du?» → **Woher kommst du?**
AUDIO: ab-wiederholung-1-uebung-7.mp3
SCRIPT: Beispiel: Ich komme aus Spanien. (du?) – Woher kommst du?
SCRIPT: 1. Ich heiße Jan. (du?) – Wie heißt du?
SCRIPT: 2. Ich bin Susanne. (du?) – Wer bist du?
SCRIPT: 3. Ich heiße Veronika Müller. (Sie?) – Wie heißen Sie?
SCRIPT: 4. Das ist Paul. (das?) – Wer ist das?
SCRIPT: 5. Ich heiße Monika Rühmann. (Sie?) – Wie heißen Sie?
SCRIPT: 6. Hallo, ich heiße Marion. (du?) – Wie heißt du?
SCRIPT: 7. Ich komme aus Österreich. (Sie?) – Woher kommen Sie?
1. ___ = Wie heißt du | hint: имя → Wie …? · du: окончание -t
2. ___ = Wer bist du ; Wie heißt du | hint: Ich bin … → Wer …?
3. ___ = Wie heißen Sie | hint: Sie: окончание -en
4. ___ = Wer ist das
5. ___ = Wie heißen Sie
6. ___ = Wie heißt du
7. ___ = Woher kommen Sie | hint: страна → Woher …?

## 7 · Fix it · Дополнительно
TYPE: fix
COLUMNS: 2
TEXT: В каждом предложении **одна** ошибка. Исправьте только неправильное слово прямо в предложении, не переписывайте всё предложение.
1. Das ist mein Schwester. = Das ist meine Schwester | hint: die Schwester → mein… ?
2. Ich habe kein Kinder. = Ich habe keine Kinder | hint: die Kinder (мн. ч.) → kein… ?
3. Woher gehst du? – Zum Deutschkurs. = Wohin gehst du? – Zum Deutschkurs ; Wohin gehst du? - Zum Deutschkurs | hint: woher = откуда, wohin = куда
4. Ich lese Deutsch in der Sprachschule. = Ich lerne Deutsch in der Sprachschule | hint: lesen = читать, lernen = учить
5. Ich möchte einen Kuchen lesen. = Ich möchte einen Kuchen backen | hint: Что делают с пирогом?
6. Wir haben um Montag Unterricht. = Wir haben am Montag Unterricht | hint: um 8 Uhr, но … Montag
