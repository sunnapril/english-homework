## 7 · Fix it · Zusatz
TYPE: fix
TEXT: In jedem Satz ist **ein** Fehler. Korrigieren Sie nur das falsche Wort direkt im Satz. Schreiben Sie nicht den ganzen Satz neu.
1. Das ist mein Schwester. = Das ist meine Schwester | hint: die Schwester → mein… ?
2. Ich habe kein Kinder. = Ich habe keine Kinder | hint: die Kinder (Plural) → kein… ?
3. Woher gehst du? – Zum Deutschkurs. = Wohin gehst du? – Zum Deutschkurs ; Wohin gehst du? - Zum Deutschkurs | hint: woher = откуда, wohin = куда
4. Ich lese Deutsch in der Sprachschule. = Ich lerne Deutsch in der Sprachschule | hint: lesen = читать, lernen = учить
5. Ich möchte einen Kuchen lesen. = Ich möchte einen Kuchen backen | hint: Was macht man mit einem Kuchen?
