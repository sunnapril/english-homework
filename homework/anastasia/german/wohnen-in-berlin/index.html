## 1 · Lesen · Читаем · 10 мин
TYPE: article
TEXT: **Wohnen in Berlin.** Viele Menschen in Berlin wohnen in kleinen Wohnungen: 30, 40 oder 50 Quadratmeter. Die Mieten sind hoch.
TEXT: Auf Instagram sieht man oft perfekte Wohnungen: weiße Wände, ein beiges Sofa, ein Tisch, keine Bücher, keine Fotos. Das ist schön, aber nicht gemütlich.
TEXT: Der Trend für Herbst 2026 ist anders. Die Wohnung ist nicht perfekt, aber gemütlich. Die Bücher stehen im Regal, Familienfotos hängen an der Wand. Ein alter Stuhl vom Flohmarkt steht neben dem Bett.
TEXT: Eine kleine Wohnung braucht gute Ideen. Der Tisch ist klein, aber man kann ihn groß machen. Das Bett hat Schubladen. Das Regal geht bis zur Decke. Ein großer Teppich macht aus einem Zimmer zwei Zonen: Wohnen und Arbeiten.
TEXT: Die Farben sind warm: Terrakotta, Beige, Braun und Grün. Grau ist nicht mehr modern. Holz, Wolle und Pflanzen machen das Zimmer gemütlich.
TEXT: Eine Berliner Wohnung ist kein Katalog. Hier wohnen Menschen!
