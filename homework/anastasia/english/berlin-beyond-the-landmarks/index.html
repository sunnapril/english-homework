## 1 · Read · 10 min
TYPE: article
TEXT: Berlin is full of history, art and energy. In 2025 more than 12 million tourists visited the city, and they spent almost 30 million nights in hotels. Most visitors come for the famous landmarks, but there are also many small, interesting places to explore.
TEXT: TV presenter Lilly Douse starts her trip at the Brandenburg Gate. It was built in 1791, and many important moments in the city's history happened near it. A local guide tells her the stories behind Berlin's best-known places.
TEXT: The Berlin Wall changed the city more than anything else. It was built in 1961 and came down in 1989, so it divided Berlin for 28 years. Today you can still see a long part of the wall. It is covered in graffiti and street art.
TEXT: Lilly also goes to a graffiti workshop. The founder of the workshop gives her tips on how to make good street art.
TEXT: In West Berlin, Lilly visits an unusual hotel. During the Second World War it was a women's prison. The windows still have iron bars, and the corridors are very long. It took ten years to renovate the building.
TEXT: Then Lilly goes on a bike tour. She cycles to Mauerpark, a park on the old border between East and West, and to Zionskirche, an old church with an important story from the time of East Germany.
TEXT: On foot, by boat or by bike: in Berlin there is always something new to see.
VOCAB: **landmark** | a famous building or place that is easy to recognise | достопримечательность
VOCAB: **explore** | to go around a place to learn about it | исследовать, осматривать
VOCAB: **divide** | to separate into two or more parts | разделять
VOCAB: **covered in** | with something all over it | покрытый чем-то
VOCAB: **workshop** | a short class where you learn to make or do something | мастер-класс
VOCAB: **prison** | a building where criminals have to stay | тюрьма
VOCAB: **iron bars** | strong metal sticks on a window | железные решётки
VOCAB: **renovate** | to repair an old building and make it look new | ремонтировать, реставрировать
