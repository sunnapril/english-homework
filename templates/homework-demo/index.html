## 1. Money phrases in new situations
TYPE: gap
TEXT: Complete each sentence with one phrase from the bank. Use every phrase once. Click a phrase after you use it.
BANK: take out; live on; pay back; stock up on; splash out on; cut back on; get into debt; set aside
1. After the rent increased, Pavel had to ___ restaurant meals for several months. = cut back on | hint: Spend less on something.
2. Last year, Mina decided to ___ ten percent of her salary for unexpected repairs. = set aside | hint: Keep money for a particular future purpose.
3. The shop expects a shortage, so it will ___ replacement batteries before winter. = stock up on | hint: Buy a supply before it is needed.
4. After saving for six months, Karim decided to ___ a high-quality office chair. = splash out on | hint: Spend a lot on something special.
5. The interest rate is high, so I would not ___ a loan unless the repair were essential. = take out | hint: Arrange to receive a loan formally.
6. It took Alina nearly a year to ___ the money she had borrowed from her sister. = pay back | hint: Return borrowed money.
7. When both parents were studying, the family had to ___ one part-time income. = live on | hint: Have only this amount available for daily needs.
8. Buying every new gadget on credit is an easy way to ___. = get into debt | hint: Begin owing more money than you can comfortably repay.

## 2. Precise words from the lesson
TYPE: choose
TEXT: Choose the word that fits both the meaning and the grammar of the complete sentence.
1. The discounted monitor was a genuine ___: it was half price and still had a full warranty. = bargain | options: bargain ; cashpoint ; compulsory | hint: A good product bought for less than its usual value.
2. For this course, attendance is ___; students cannot receive the certificate if they miss more than two sessions. = compulsory | options: important ; compulsory ; compulsive | hint: Required by a rule, not simply useful.
3. Regular backups are ___, but they are not legally required by the company. = essential | options: essential ; compulsive ; cashpoint | hint: Needed for the system to remain safe and usable.
4. The bank closed its local branch but installed a ___ outside the supermarket. = cashpoint | options: bargain ; cashpoint ; wealth | hint: A machine used to withdraw cash.
5. His ___ shopping was no longer an occasional mistake; he felt unable to stop buying things online. = compulsive | options: compulsory ; compulsive ; necessary | hint: Difficult to control because of a strong repeated urge.
6. It is ___ to keep the receipt if you may need to return the device, although the shop can sometimes find a digital copy. = necessary | options: necessary ; obnoxious ; compulsory | hint: Needed in this situation to achieve a practical result.

## 3. What should have happened?
TYPE: choose
TEXT: Choose the complete form that expresses the intended meaning. The situations are new; focus on the relationship between the real past and the speaker’s present view.
1. The annual plan renewed automatically last night. I wish I ___ the reminder email more carefully. = had read | options: had read ; would read ; have read | hint: Wish + Past Perfect expresses regret about a completed past action.
2. The cheaper charger damaged the battery. If only we ___ the manufacturer’s warning. = had not ignored | options: had not ignored ; did not ignore ; would not ignore | hint: The warning was ignored; the speaker now wishes the opposite had happened.
3. You ___ the only copy of the project on an old USB drive. = should not have kept | options: should not have kept ; did not have to keep ; were not supposed keep | hint: The action happened, and the speaker now criticises it.
4. I ___ my files before installing the experimental update. = ought to have backed up | options: ought to have backed up ; ought to back up ; might back up | hint: This names the better past action that was not taken.
5. We paid the full monthly price for a year, although we ___ money with an annual plan. = could have saved | options: could have saved ; could save yesterday ; must have saved | hint: The cheaper option was available, but we did not use it.
6. If the company had explained the extra fee clearly, we ___ the misunderstanding. = might have avoided | options: might have avoided ; were supposed to avoid ; should avoid | hint: This is a possible different result of an unreal past condition.
7. The trial ___ on Friday, but the company charged us for another month. = was supposed to end | options: was supposed to end ; should have ending ; could ended | hint: There was a past expectation that was not fulfilled.
8. The fault appeared only after a rare software update; the technician ___ it during the routine inspection. = could not have predicted | options: could not have predicted ; should not predict ; was not supposed predict | hint: The past result was impossible to foresee.

## 4. What should they have done differently?
TYPE: open
TEXT: Choose **one** situation and write **70–90 words**.
- **A.** A streaming service renewed an annual subscription without sending a clear reminder. The customer noticed the payment two weeks later.
- **B.** A cheap power supply unit malfunctioned and damaged another computer component.
- **C.** A large discount persuaded someone to buy a device they did not actually need.
TEXT: Explain what went wrong, what the person **should or could have done differently**, and what you would recommend now.
SUPPORT: with hindsight · a bargain · a false economy · take into account · set aside money · should have checked · could have avoided · might have been better off · on the one hand / on the other hand
PROMPT: What should they have done differently?
